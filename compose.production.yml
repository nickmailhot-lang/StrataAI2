services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strataai}
      POSTGRES_USER: ${POSTGRES_USER:-strataai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - strataai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strataai} -d ${POSTGRES_DB:-strataai}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        STRATAAI_BUILD_REVISION: ${STRATAAI_BUILD_REVISION:-development}
        STRATAAI_BUILD_VERSION: ${STRATAAI_BUILD_VERSION:-0.0.0-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATAAI_RUNTIME_MODE: production
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-strataai};Username=${POSTGRES_USER:-strataai};Password=${POSTGRES_PASSWORD}
      STRATAAI_IDENTITY_EMAIL_ENABLED: ${STRATAAI_IDENTITY_EMAIL_ENABLED:-false}
      STRATAAI_IDENTITY_EMAIL_FROM: ${STRATAAI_IDENTITY_EMAIL_FROM:-}
      STRATAAI_PUBLIC_ORIGIN: ${STRATAAI_PUBLIC_ORIGIN:-}
      STRATAAI_IDENTITY_EMAIL_ACCOUNT: ${STRATAAI_IDENTITY_EMAIL_ACCOUNT:-}
      STRATAAI_IDENTITY_TOKEN_CURRENT_KEY: ${STRATAAI_IDENTITY_TOKEN_CURRENT_KEY:-}
      STRATAAI_IDENTITY_TOKEN_KEYS: ${STRATAAI_IDENTITY_TOKEN_KEYS:-}
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        STRATAAI_BUILD_REVISION: ${STRATAAI_BUILD_REVISION:-development}
        STRATAAI_BUILD_VERSION: ${STRATAAI_BUILD_VERSION:-0.0.0-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATAAI_RUNTIME_MODE: production
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-strataai};Username=${POSTGRES_USER:-strataai};Password=${POSTGRES_PASSWORD}
      STRATAAI_IDENTITY_EMAIL_ENABLED: ${STRATAAI_IDENTITY_EMAIL_ENABLED:-false}
      STRATAAI_IDENTITY_EMAIL_FROM: ${STRATAAI_IDENTITY_EMAIL_FROM:-}
      STRATAAI_PUBLIC_ORIGIN: ${STRATAAI_PUBLIC_ORIGIN:-}
      STRATAAI_IDENTITY_EMAIL_ACCOUNT: ${STRATAAI_IDENTITY_EMAIL_ACCOUNT:-}
      STRATAAI_IDENTITY_TOKEN_CURRENT_KEY: ${STRATAAI_IDENTITY_TOKEN_CURRENT_KEY:-}
      STRATAAI_IDENTITY_TOKEN_KEYS: ${STRATAAI_IDENTITY_TOKEN_KEYS:-}
      STRATAAI_IDENTITY_EMAIL_API_KEY: ${STRATAAI_IDENTITY_EMAIL_API_KEY:-}
      ConnectionStrings__IdentityDeliveryPostgres: ${STRATAAI_IDENTITY_DELIVERY_CONNECTION_STRING:-}
    ports:
      - "8081:8081"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        STRATAAI_BUILD_REVISION: ${STRATAAI_BUILD_REVISION:-development}
        STRATAAI_BUILD_VERSION: ${STRATAAI_BUILD_VERSION:-0.0.0-dev}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"

volumes:
  strataai-postgres:
