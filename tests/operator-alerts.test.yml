rule_files:
  - ../deploy/metrics/alerts.yml
evaluation_interval: 1m
tests:
  - name: healthy and fixed aggregate alert labels
    interval: 1m
    input_series:
      - series: up{job="strataai-collector",instance="private-host"}
        values: 1x40
      - series: strataai_http_server_requests{service_namespace="strataai",service_name="strataai-api",instance="private-host",private_marker="private@example.test",status_code="200",outcome="completed"}
        values: 0+10x40
      - series: strataai_http_server_requests{service_namespace="strataai",service_name="strataai-api",instance="private-host",private_marker="private@example.test",status_code="500",outcome="completed"}
        values: "0x40"
      - series: strataai_http_server_duration_count{service_namespace="strataai",service_name="strataai-api",instance="private-host",private_marker="private@example.test"}
        values: 0+10x40
      - series: strataai_http_server_duration_bucket{service_namespace="strataai",service_name="strataai-api",instance="private-host",private_marker="private@example.test",le="0.75"}
        values: 0+10x40
      - series: strataai_worker_loop_failures{service_namespace="strataai",service_name="strataai-worker",instance="private-host",private_marker="private@example.test",queue="organization"}
        values: "0x40"
      - series: strataai_worker_jobs{service_namespace="strataai",service_name="strataai-worker",instance="private-host",private_marker="private@example.test",queue="identity_email",outcome="failed"}
        values: "0x40"
      - series: strataai_worker_scoped_backlog_available{service_namespace="strataai",service_name="strataai-worker",instance="private-host",private_marker="private@example.test",queue="organization"}
        values: 1x40
      - series: strataai_worker_identity_backlog_available{service_namespace="strataai",service_name="strataai-worker",instance="private-host",private_marker="private@example.test",queue="identity_email"}
        values: 1x40
    alert_rule_test:
      - eval_time: 15m
        alertname: StrataAiCollectorUnavailable
        exp_alerts: []
      - eval_time: 15m
        alertname: StrataAiApiErrors
        exp_alerts: []
      - eval_time: 15m
        alertname: StrataAiApiHistogramUnavailable
        exp_alerts: []
      - eval_time: 15m
        alertname: StrataAiApiLatency
        exp_alerts: []
      - eval_time: 15m
        alertname: StrataAiWorkerLoopFailures
        exp_alerts: []
      - eval_time: 15m
        alertname: StrataAiEmailDeliveryFailures
        exp_alerts: []
      - eval_time: 15m
        alertname: StrataAiOrganizationBacklogUnknown
        exp_alerts: []
      - eval_time: 15m
        alertname: StrataAiIdentityBacklogUnknown
        exp_alerts: []
  - name: missing scrape configuration is not healthy
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 0m
        alertname: StrataAiCollectorUnavailable
        exp_alerts: []
