        exp_alerts: []
      - eval_time: 0m
        alertname: StrataAiIdentityBacklogUnknown
        exp_alerts: []
      - eval_time: 3m
        alertname: StrataAiCollectorUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              component: metrics
            exp_annotations:
              summary: StrataAI metrics scrape coverage is unavailable
      - eval_time: 3m
