# Optional operator receiver; app images remain the same immutable release images.
services:
  api:
    environment:
      STRATAAI_METRICS_OTLP_ENDPOINT: ${STRATAAI_METRICS_OTLP_ENDPOINT:-http://metrics-collector:4318/v1/metrics}
  worker:
    environment:
      STRATAAI_METRICS_OTLP_ENDPOINT: ${STRATAAI_METRICS_OTLP_ENDPOINT:-http://metrics-collector:4318/v1/metrics}
  metrics-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/strataai/metrics.yml"]
    volumes:
      - ./deploy/metrics/collector.yml:/etc/strataai/metrics.yml:ro
    ports:
      - "127.0.0.1:9464:9464"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
