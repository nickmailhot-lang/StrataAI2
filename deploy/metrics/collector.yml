receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    without_scope_info: true
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    resource_constant_labels:
      included: [service.name, service.namespace, service.version, strataai.build.revision]
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
