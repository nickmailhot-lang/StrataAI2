# Optional existing backend on the same Docker host; see release instructions.
# Change the private target when Prometheus runs elsewhere. Never expose OTLP.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 1m
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: strataai-collector
    honor_labels: true
    static_configs:
      - targets: [127.0.0.1:9464]
