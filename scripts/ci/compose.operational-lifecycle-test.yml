# Isolated typed discovery using the already built release Worker.
services:
  worker:
    environment:
      STRATAAI_WORKER_ORGANIZATION_IDS: ''
      STRATAAI_ORGANIZATION_OPERATIONAL_LIFECYCLE_DISCOVERY_ENABLED: 'true'
      STRATAAI_ORGANIZATION_DELETION_DISCOVERY_ENABLED: 'false'
      STRATAAI_ORGANIZATION_METADATA_DISCOVERY_ENABLED: 'false'
      STRATAAI_ORGANIZATION_CONFIGURATION_DISCOVERY_ENABLED: 'false'
      STRATAAI_INVITATION_RECIPIENT_AUTHORITY_DISCOVERY_ENABLED: 'false'
      STRATAAI_INVITATION_ISSUER_AUTHORITY_DISCOVERY_ENABLED: 'false'
      STRATAAI_ATTACHMENTS_ENABLED: 'false'
      STRATAAI_INVITATION_EMAIL_ENABLED: 'false'
      STRATAAI_IDENTITY_EMAIL_ENABLED: 'false'
