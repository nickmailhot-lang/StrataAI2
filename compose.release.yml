services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strataai}
      POSTGRES_USER: ${POSTGRES_USER:-strataai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      STRATAAI_API_DB_PASSWORD: ${STRATAAI_API_DB_PASSWORD:?Set STRATAAI_API_DB_PASSWORD}
      STRATAAI_WORKER_DB_PASSWORD: ${STRATAAI_WORKER_DB_PASSWORD:?Set STRATAAI_WORKER_DB_PASSWORD}
    volumes:
      - strataai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strataai} -d ${POSTGRES_DB:-strataai}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${STRATAAI_API_IMAGE:-strataai-api:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATAAI_RUNTIME_MODE: production
      ASPNETCORE_ENVIRONMENT: Production
      STRATAAI_DATABASE_HOST: postgres
      STRATAAI_DATABASE_NAME: ${POSTGRES_DB:-strataai}
      STRATAAI_DATABASE_USERNAME: strataai_api_runtime
      STRATAAI_REALTIME_PUBLIC_ORIGIN: ${STRATAAI_REALTIME_PUBLIC_ORIGIN:-}
      STRATAAI_DATABASE_PASSWORD: ${STRATAAI_API_DB_PASSWORD}
      STRATAAI_AUTH_RETRY_CURRENT_KEY: ${STRATAAI_AUTH_RETRY_CURRENT_KEY:-}
      STRATAAI_AUTH_RETRY_KEYS: ${STRATAAI_AUTH_RETRY_KEYS:-}
      STRATAAI_INVITATION_EMAIL_ENABLED: ${STRATAAI_INVITATION_EMAIL_ENABLED:-false}
      STRATAAI_IDENTITY_EMAIL_ENABLED: ${STRATAAI_IDENTITY_EMAIL_ENABLED:-false}
      STRATAAI_IDENTITY_EMAIL_FROM: ${STRATAAI_IDENTITY_EMAIL_FROM:-}
      STRATAAI_PUBLIC_ORIGIN: ${STRATAAI_PUBLIC_ORIGIN:-}
      STRATAAI_IDENTITY_EMAIL_ACCOUNT: ${STRATAAI_IDENTITY_EMAIL_ACCOUNT:-}
      STRATAAI_IDENTITY_TOKEN_CURRENT_KEY: ${STRATAAI_IDENTITY_TOKEN_CURRENT_KEY:-}
      STRATAAI_IDENTITY_TOKEN_KEYS: ${STRATAAI_IDENTITY_TOKEN_KEYS:-}
    ports:
      - "8080:8080"

  worker:
    image: ${STRATAAI_WORKER_IMAGE:-strataai-worker:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATAAI_RUNTIME_MODE: production
      ASPNETCORE_ENVIRONMENT: Production
      STRATAAI_DATABASE_HOST: postgres
      STRATAAI_DATABASE_NAME: ${POSTGRES_DB:-strataai}
      STRATAAI_DATABASE_USERNAME: strataai_worker_runtime
      STRATAAI_DATABASE_PASSWORD: ${STRATAAI_WORKER_DB_PASSWORD}
      STRATAAI_WORKER_ORGANIZATION_IDS: ${STRATAAI_WORKER_ORGANIZATION_IDS:-}
      STRATAAI_INVITATION_EMAIL_ENABLED: ${STRATAAI_INVITATION_EMAIL_ENABLED:-false}
      STRATAAI_IDENTITY_EMAIL_ENABLED: ${STRATAAI_IDENTITY_EMAIL_ENABLED:-false}
      STRATAAI_IDENTITY_EMAIL_FROM: ${STRATAAI_IDENTITY_EMAIL_FROM:-}
      STRATAAI_PUBLIC_ORIGIN: ${STRATAAI_PUBLIC_ORIGIN:-}
      STRATAAI_IDENTITY_EMAIL_ACCOUNT: ${STRATAAI_IDENTITY_EMAIL_ACCOUNT:-}
      STRATAAI_IDENTITY_TOKEN_CURRENT_KEY: ${STRATAAI_IDENTITY_TOKEN_CURRENT_KEY:-}
      STRATAAI_IDENTITY_TOKEN_KEYS: ${STRATAAI_IDENTITY_TOKEN_KEYS:-}
      STRATAAI_IDENTITY_EMAIL_API_KEY: ${STRATAAI_IDENTITY_EMAIL_API_KEY:-}
      ConnectionStrings__IdentityDeliveryPostgres: ${STRATAAI_IDENTITY_DELIVERY_CONNECTION_STRING:-}
    ports:
      - "8081:8081"

  web:
    image: ${STRATAAI_WEB_IMAGE:-strataai-web:local}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"

volumes:
  strataai-postgres:
