services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strataai}
      POSTGRES_USER: ${POSTGRES_USER:-strataai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      STRATAAI_API_DB_PASSWORD: ${STRATAAI_API_DB_PASSWORD:?Set STRATAAI_API_DB_PASSWORD}
      STRATAAI_WORKER_DB_PASSWORD: ${STRATAAI_WORKER_DB_PASSWORD:?Set STRATAAI_WORKER_DB_PASSWORD}
      STRATAAI_IDENTITY_DELIVERY_DB_PASSWORD: ${STRATAAI_IDENTITY_DELIVERY_DB_PASSWORD:-}
    volumes:
      - strataai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strataai} -d ${POSTGRES_DB:-strataai}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${STRATAAI_API_IMAGE:?Set the retained API image from build-metadata.json}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATAAI_RUNTIME_MODE: production
      ASPNETCORE_ENVIRONMENT: Production
      STRATAAI_DATABASE_HOST: postgres
      STRATAAI_DATABASE_SSL_MODE: Disable
      STRATAAI_DATABASE_NAME: ${POSTGRES_DB:-strataai}
      STRATAAI_DATABASE_USERNAME: strataai_api_runtime
      STRATAAI_ACTIVITY_KEY_DIRECTORY: /var/lib/strataai/activity-keys
      STRATAAI_REALTIME_PUBLIC_ORIGIN: ${STRATAAI_REALTIME_PUBLIC_ORIGIN:-}
      STRATAAI_METRICS_OTLP_ENDPOINT: ${STRATAAI_METRICS_OTLP_ENDPOINT:-}
      STRATAAI_METRICS_OTLP_HEADERS: ${STRATAAI_METRICS_OTLP_HEADERS:-}
      STRATAAI_DATABASE_PASSWORD: ${STRATAAI_API_DB_PASSWORD}
      STRATAAI_AUTH_RETRY_CURRENT_KEY: ${STRATAAI_AUTH_RETRY_CURRENT_KEY:-}
      STRATAAI_AUTH_RETRY_KEYS: ${STRATAAI_AUTH_RETRY_KEYS:-}
      STRATAAI_AUTH_ALLOW_SELF_REGISTRATION: ${STRATAAI_AUTH_ALLOW_SELF_REGISTRATION-false}
      STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL: ${STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL-true}
      STRATAAI_AUTH_MIN_PASSWORD_LENGTH: ${STRATAAI_AUTH_MIN_PASSWORD_LENGTH-12}
      STRATAAI_AUTH_SESSION_HOURS: ${STRATAAI_AUTH_SESSION_HOURS-12}
      STRATAAI_AUTH_SECURITY_TOKEN_MINUTES: ${STRATAAI_AUTH_SECURITY_TOKEN_MINUTES-30}
      STRATAAI_INVITATION_EMAIL_ENABLED: ${STRATAAI_INVITATION_EMAIL_ENABLED:-false}
      STRATAAI_IDENTITY_EMAIL_ENABLED: ${STRATAAI_IDENTITY_EMAIL_ENABLED:-false}
      STRATAAI_IDENTITY_EMAIL_FROM: ${STRATAAI_IDENTITY_EMAIL_FROM:-}
      STRATAAI_PUBLIC_ORIGIN: ${STRATAAI_PUBLIC_ORIGIN:-}
      STRATAAI_IDENTITY_EMAIL_ACCOUNT: ${STRATAAI_IDENTITY_EMAIL_ACCOUNT:-}
      STRATAAI_IDENTITY_TOKEN_CURRENT_KEY: ${STRATAAI_IDENTITY_TOKEN_CURRENT_KEY:-}
      STRATAAI_IDENTITY_TOKEN_KEYS: ${STRATAAI_IDENTITY_TOKEN_KEYS:-}
    ports:
      - "8080:8080"

    volumes:
      - strataai-activity-keys:/var/lib/strataai/activity-keys

  worker:
    image: ${STRATAAI_WORKER_IMAGE:?Set the retained Worker image from build-metadata.json}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATAAI_RUNTIME_MODE: production
      ASPNETCORE_ENVIRONMENT: Production
      STRATAAI_DATABASE_HOST: postgres
      STRATAAI_DATABASE_SSL_MODE: Disable
      STRATAAI_DATABASE_NAME: ${POSTGRES_DB:-strataai}
      STRATAAI_DATABASE_USERNAME: strataai_worker_runtime
      STRATAAI_DATABASE_PASSWORD: ${STRATAAI_WORKER_DB_PASSWORD}
      STRATAAI_WORKER_ORGANIZATION_IDS: ${STRATAAI_WORKER_ORGANIZATION_IDS:-}
      STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL: ${STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL-true}
      STRATAAI_ORGANIZATION_DELETION_DISCOVERY_ENABLED: ${STRATAAI_ORGANIZATION_DELETION_DISCOVERY_ENABLED-true}
      STRATAAI_ORGANIZATION_METADATA_DISCOVERY_ENABLED: ${STRATAAI_ORGANIZATION_METADATA_DISCOVERY_ENABLED-true}
      STRATAAI_ORGANIZATION_CONFIGURATION_DISCOVERY_ENABLED: ${STRATAAI_ORGANIZATION_CONFIGURATION_DISCOVERY_ENABLED-true}
      STRATAAI_ORGANIZATION_OPERATIONAL_LIFECYCLE_DISCOVERY_ENABLED: ${STRATAAI_ORGANIZATION_OPERATIONAL_LIFECYCLE_DISCOVERY_ENABLED-true}
      STRATAAI_INVITATION_RECIPIENT_AUTHORITY_DISCOVERY_ENABLED: ${STRATAAI_INVITATION_RECIPIENT_AUTHORITY_DISCOVERY_ENABLED-true}
      STRATAAI_INVITATION_ISSUER_AUTHORITY_DISCOVERY_ENABLED: ${STRATAAI_INVITATION_ISSUER_AUTHORITY_DISCOVERY_ENABLED-true}
      STRATAAI_INVITATION_EMAIL_ENABLED: ${STRATAAI_INVITATION_EMAIL_ENABLED:-false}
      STRATAAI_IDENTITY_EMAIL_ENABLED: ${STRATAAI_IDENTITY_EMAIL_ENABLED:-false}
      STRATAAI_IDENTITY_EMAIL_FROM: ${STRATAAI_IDENTITY_EMAIL_FROM:-}
      STRATAAI_PUBLIC_ORIGIN: ${STRATAAI_PUBLIC_ORIGIN:-}
      STRATAAI_IDENTITY_EMAIL_ACCOUNT: ${STRATAAI_IDENTITY_EMAIL_ACCOUNT:-}
      STRATAAI_IDENTITY_TOKEN_CURRENT_KEY: ${STRATAAI_IDENTITY_TOKEN_CURRENT_KEY:-}
      STRATAAI_IDENTITY_TOKEN_KEYS: ${STRATAAI_IDENTITY_TOKEN_KEYS:-}
      STRATAAI_IDENTITY_EMAIL_API_KEY: ${STRATAAI_IDENTITY_EMAIL_API_KEY:-}
      ConnectionStrings__IdentityDeliveryPostgres: ${STRATAAI_IDENTITY_DELIVERY_CONNECTION_STRING:-}
    ports:
      - "8081:8081"

  web:
    image: ${STRATAAI_WEB_IMAGE:?Set the retained web image from build-metadata.json}
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"

volumes:
  strataai-postgres:
  strataai-activity-keys:
