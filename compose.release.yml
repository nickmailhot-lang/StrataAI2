services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strataai}
      POSTGRES_USER: ${POSTGRES_USER:-strataai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - strataai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strataai} -d ${POSTGRES_DB:-strataai}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${STRATAAI_API_IMAGE:-strataai-api:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATAAI_RUNTIME_MODE: production
      ASPNETCORE_ENVIRONMENT: Production
      STRATAAI_BUILD_REVISION: ${STRATAAI_BUILD_REVISION:-unknown}
      STRATAAI_BUILD_VERSION: ${STRATAAI_BUILD_VERSION:-0.0.0}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-strataai};Username=${POSTGRES_USER:-strataai};Password=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"

  worker:
    image: ${STRATAAI_WORKER_IMAGE:-strataai-worker:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STRATAAI_RUNTIME_MODE: production
      ASPNETCORE_ENVIRONMENT: Production
      STRATAAI_BUILD_REVISION: ${STRATAAI_BUILD_REVISION:-unknown}
      STRATAAI_BUILD_VERSION: ${STRATAAI_BUILD_VERSION:-0.0.0}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-strataai};Username=${POSTGRES_USER:-strataai};Password=${POSTGRES_PASSWORD}
    ports:
      - "8081:8081"

  web:
    image: ${STRATAAI_WEB_IMAGE:-strataai-web:local}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"

volumes:
  strataai-postgres:
