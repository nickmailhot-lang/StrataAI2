limit_req_zone $binary_remote_addr zone=sensitive_requests:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/security-headers.inc;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(auth|invitations|organizations/[^/]+/invitations)(/|$) {
        limit_req zone=sensitive_requests burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @rate_limited {
        default_type application/problem+json;
        include /etc/nginx/security-headers.inc;
        add_header Retry-After 60 always;
        return 429 '{"type":"about:blank","title":"Too many requests. Please wait and retry.","status":429,"code":"rate_limit_exceeded"}';
    }

    location ~ ^/(me|organizations|boards|lists|cards)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
