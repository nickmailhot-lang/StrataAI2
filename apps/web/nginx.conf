limit_req_zone $binary_remote_addr zone=sensitive_requests:10m rate=60r/m;
map $http_upgrade $work_upgrade_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/security-headers.inc;
    # Docker service addresses can change when API containers are replaced.
    # Resolve the service at request time so the edge recovers without restart.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8080;

    location ^~ /me/live {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $work_upgrade_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location ^~ /boards/live {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $work_upgrade_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(auth|invitations|organizations/[^/]+/invitations)(/|$) {
        limit_req zone=sensitive_requests burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @rate_limited {
        default_type application/problem+json;
        include /etc/nginx/security-headers.inc;
        add_header Retry-After 60 always;
        return 429 '{"type":"about:blank","title":"Too many requests. Please wait and retry.","status":429,"code":"rate_limit_exceeded"}';
    }

    location ~ ^/(me|organizations|boards|lists|cards|labels)(/|$) {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
