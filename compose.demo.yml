services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        STRATAAI_BUILD_REVISION: ${STRATAAI_BUILD_REVISION:-development}
        STRATAAI_BUILD_VERSION: ${STRATAAI_BUILD_VERSION:-0.0.0-dev}
    environment:
      STRATAAI_RUNTIME_MODE: demo
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        STRATAAI_BUILD_REVISION: ${STRATAAI_BUILD_REVISION:-development}
        STRATAAI_BUILD_VERSION: ${STRATAAI_BUILD_VERSION:-0.0.0-dev}
    environment:
      STRATAAI_RUNTIME_MODE: demo
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8081:8081"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        STRATAAI_BUILD_REVISION: ${STRATAAI_BUILD_REVISION:-development}
        STRATAAI_BUILD_VERSION: ${STRATAAI_BUILD_VERSION:-0.0.0-dev}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"
