services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      STRATAAI_RUNTIME_MODE: demo
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      STRATAAI_RUNTIME_MODE: demo
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8081:8081"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"
