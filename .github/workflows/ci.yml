name: StrataAI2 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  # Keep every distinct main/tag commit: ref-wide groups retain only one pending
  # run by default, even when cancel-in-progress is false. Hosted CI topologies
  # and exact-SHA artifacts are isolated per run; this is not a deployment gate.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  STRATAAI_IMAGE_TAG: ${{ github.sha }}

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      short_sha: ${{ steps.identity.outputs.short_sha }}
      version: ${{ steps.identity.outputs.version }}
      image_tag: ${{ steps.identity.outputs.image_tag }}
      workflow_run_id: ${{ steps.identity.outputs.workflow_run_id }}
      repository: ${{ steps.identity.outputs.repository }}
      created_at: ${{ steps.identity.outputs.created_at }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify metadata refusal and version contracts
        run: node --test tests/build-metadata.test.mjs
      - name: Calculate verified exact-commit metadata
        id: identity
        run: node scripts/ci/build-metadata.mjs
      - name: Retain canonical build metadata
        uses: actions/upload-artifact@v7
        with:
          name: strataai-build-metadata-${{ github.sha }}
          path: build-metadata.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

  web-quality:
    name: web-quality
    runs-on: ubuntu-24.04
    needs: [metadata]
    steps:
      - uses: actions/checkout@v7

      - name: Download source evidence identity
        uses: actions/download-artifact@v8
        with:
          name: strataai-build-metadata-${{ github.sha }}
          path: source-inputs

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify mandatory immutable integration coverage
        run: |
          node scripts/ci/verify-integration-suites.mjs
          node --test tests/integration-suites.test.mjs
          node --test tests/release-bundle-startup.test.mjs

      - name: Verify complete browser shard coverage
        run: |
          node --test tests/browser-shards.test.mjs
          node scripts/ci/verify-browser-shards.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck browser acceptance fixtures
        run: npm run typecheck:browser

      - name: Verify browser readiness excludes previous-screen responses
        run: |
          node --experimental-strip-types --test tests/browser/boardReadTracker.test.mjs
          node --experimental-strip-types --test tests/browser/invitationAdmissionTracker.test.mjs
          node --experimental-strip-types --test tests/browser/scopedBoardWorker.test.mjs
          node --experimental-strip-types --test tests/browser/capacityScrollDiagnostics.test.mjs

      - name: Verify security assertion failure paths
        run: scripts/ci/test-security-assertions.sh

      - name: Lint
        run: npm run lint

      - name: Verify feature HTTP requests retain the shared Problem boundary
        run: node --test tests/web-architecture.test.mjs

      - name: Verify retained performance evidence excludes private fields
        run: node --test tests/browser-performance.test.mjs

      - name: Verify operator evidence rejects missing and private metric fields
        run: python3 -m unittest discover -s tests -p 'operator_metrics_test.py'

      - name: Verify source test report completeness and privacy
        run: |
          python3 -m unittest discover -s tests -p 'source_test_reports_test.py'
          python3 -m unittest discover -s tests -p 'evidence_artifacts_test.py'
          python3 -m unittest discover -s tests -p 'release_artifacts_test.py'
          python3 -m unittest discover -s tests -p 'image_labels_test.py'

      - name: Unit and component tests
        run: |
          mkdir -p "$RUNNER_TEMP/source-tests-raw"
          npm --workspace @strataai/web run test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/source-tests-raw/web.xml"

      - name: Summarize web source test results
        if: always()
        run: python3 scripts/ci/summarize-source-tests.py --format junit --metadata source-inputs/build-metadata.json --output artifacts/source-tests/web.json "$RUNNER_TEMP/source-tests-raw/web.xml"

      - name: Retain web source test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-test-results-web-${{ github.sha }}
          path: artifacts/source-tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Production web build
        env:
          VITE_STRATAAI_BUILD_REVISION: ${{ needs.metadata.outputs.revision }}
          VITE_STRATAAI_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
        run: npm run build

      - name: Verify generated web build identity
        env:
          STRATAAI_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
        run: jq -e --arg revision "$GITHUB_SHA" --arg version "$STRATAAI_BUILD_VERSION" '.revision == $revision and .version == $version' apps/web/dist/build-metadata.json

  dotnet-quality:
    name: dotnet-quality
    runs-on: ubuntu-24.04
    needs: [metadata]
    steps:
      - uses: actions/checkout@v7

      - name: Download source evidence identity
        uses: actions/download-artifact@v8
        with:
          name: strataai-build-metadata-${{ github.sha }}
          path: source-inputs

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore StrataAI2.slnx --locked-mode

      - name: Validate release and event fixture configuration before image builds
        run: |
          docker compose --env-file .env.release.example -f compose.release.yml config --quiet
          STRATAAI_ATTACHMENT_S3_BUCKET=strata-private-ci-fixture STRATAAI_ATTACHMENT_S3_OWNER=123456789012 STRATAAI_ATTACHMENT_S3_REGION=us-east-1 STRATAAI_WORKER_ORGANIZATION_IDS=11111111-1111-1111-1111-111111111111 STRATAAI_ATTACHMENT_SCANNER_DIRECTORY=/tmp/strata-scanner docker compose --env-file .env.release.example -f compose.release.yml -f compose.attachments.yml config --quiet
          STRATAAI_TEST_EVENT_ORGANIZATION_ID=11111111-1111-1111-1111-111111111111 docker compose --env-file .env.release.example -f compose.release.yml -f scripts/ci/compose.work-event-test.yml config --quiet
          docker compose --env-file .env.release.example -f compose.release.yml -f scripts/ci/compose.auth-test.yml -f scripts/ci/compose.atomic-test.yml -f scripts/ci/compose.owner-continuity-test.yml config --quiet
          STRATAAI_TEST_TOKEN_KEYS='{}' STRATAAI_TEST_INVITATION_ORGANIZATION_ID=11111111-1111-1111-1111-111111111111 docker compose --env-file .env.release.example -f compose.release.yml -f scripts/ci/compose.auth-test.yml -f scripts/ci/compose.identity-test.yml -f scripts/ci/compose.invitation-signup-test.yml -f scripts/ci/compose.invitation-mail-test.yml config --quiet

      - name: Verify every declared realtime hub retains its edge upgrade route
        run: python3 scripts/ci/verify-realtime-proxy.py

      - name: Reject dependency lock drift
        run: scripts/ci/test-dependency-locks.sh

      - name: Verify attachment refusal fixtures replace environment defaults
        run: bash scripts/ci/test-attachment-runtime-fixture-arguments.sh

      - name: Verify runtime isolation and startup refusal runners
        run: |
          bash scripts/ci/test-demo-network-isolation-fixture.sh
          bash scripts/ci/test-demo-worker-network-isolation-fixture.sh
          bash scripts/ci/test-runtime-startup-refusals-fixture.sh

      - name: Verify declared attachment scanner protocol fixture
        run: python3 tests/attachment-scanner-fixture.py

      - name: Build with warnings as errors
        run: dotnet build StrataAI2.slnx --configuration Release --no-restore

      - name: Domain tests
        run: dotnet test --project tests/StrataAI.Domain.Tests/StrataAI.Domain.Tests.csproj --configuration Release --no-build --report-trx --report-trx-filename domain.trx --results-directory "$RUNNER_TEMP/source-tests-raw"

      - name: API host tests
        run: dotnet test --project tests/StrataAI.Api.Tests/StrataAI.Api.Tests.csproj --configuration Release --no-build --report-trx --report-trx-filename api.trx --results-directory "$RUNNER_TEMP/source-tests-raw"

      - name: Summarize .NET source test results
        if: always()
        run: python3 scripts/ci/summarize-source-tests.py --format trx --metadata source-inputs/build-metadata.json --output artifacts/source-tests/dotnet.json "$RUNNER_TEMP/source-tests-raw/domain.trx" "$RUNNER_TEMP/source-tests-raw/api.trx"

      - name: Retain .NET source test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-test-results-dotnet-${{ github.sha }}
          path: artifacts/source-tests/
          if-no-files-found: ignore
          retention-days: 14

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-24.04
    needs: [metadata]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: strataai_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strataai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: strataai_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Apply ordered migrations
        run: scripts/ci/apply-migrations.sh

      - name: Verify every migrated tenant table retains its isolation boundary
        run: scripts/ci/test-tenant-schema.sh

      - name: Verify migration repeat, upgrade, failure rollback and serialization
        run: scripts/ci/test-migration-runner.sh

      - name: Verify pgvector and forced tenant RLS
        run: scripts/ci/test-rls.sh

      - name: Verify Board label and Card association isolation
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-board-label-storage.sql

      - name: Verify Card member and assigning actor tenant integrity
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-card-member-storage.sql

      - name: Verify Checklist tenant isolation, ranks, completion and progress integrity
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-checklist-storage.sql

      - name: Verify Attachment metadata isolation, parent identity and quarantine constraints
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-attachment-storage.sql

      - name: Verify Comment tenant isolation, immutable author and revisioned redaction
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-comment-storage.sql
      - name: Verify ordered Organization Board journal and restricted source projection
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-organization-board-journal.sql

      - name: Verify actor-specific directory permission epochs and rollback
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-organization-board-directory-epochs.sql

      - name: Verify reader directory epochs, visibility withdrawal and archive separation
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-organization-board-reader-epochs.sql

      - name: Verify actor-private search source capability, deduplication and rollback
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-search-interaction-sources.sql

      - name: Verify actor-private navigation source admission and rollback
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-navigation-interaction-sources.sql

      - name: Verify immutable activity attribution and historical account interpretation
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-activity-attribution.sql
      - name: Verify immutable body-free comment mention snapshots and tenant isolation
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-comment-mention-snapshots.sql

      - name: Verify canonical mention handles, immutable reservations and account boundaries
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-mention-handle-storage.sql

      - name: Verify account handle receipts, immutable metadata and expired-only cleanup
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-handle-claim-replay-storage.sql

      - name: Verify durable upload identity, tenant isolation and publication transitions
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-upload-intent-storage.sql

      - name: Verify private Reminder delivery, eligibility, leases and atomic effects
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-card-reminder-delivery.sql

      - name: Verify append-only audit storage
        run: scripts/ci/test-audit-append-only.sh

      - name: Verify tenant-scoped durable jobs and retry/crash behavior
        run: scripts/ci/test-background-jobs.sh

      - name: Verify global identity delivery capability and token integrity
        run: scripts/ci/test-identity-delivery-scope.sh

      - name: Verify real restricted runtime logins and elevation rejection
        run: scripts/ci/test-runtime-roles.sh

      - name: Verify recipient authority revision clocks and idempotent effects
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-invitation-authority-revision-clocks.sql

      - name: Verify invitation mail clocks without widening delivery authority
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-invitation-mail-update-clocks.sql

      - name: Verify Work event delivery clocks and immutable history
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-work-event-update-clocks.sql

      - name: Verify attachment sweep creation, advancement and reset clocks
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-attachment-sweep-clocks.sql

      - name: Verify Work receipt creation, completion and replay clocks
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-work-replay-update-clocks.sql

      - name: Verify private invitation recipient source, atomic rollback and restricted capabilities
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-invitation-recipient-events.sql

      - name: Verify bounded recipient authority source, lease and rollback capabilities
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-invitation-recipient-authority.sql

      - name: Verify authority discovery limits and restricted claim capabilities
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-invitation-recipient-authority-discovery.sql

      - name: Verify canonical Board recipient authority paging and restricted capabilities
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/test-invitation-recipient-board-authority.sql
      - name: Current Board membership producer authority routing and idempotent delivery
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/invitation-membership-authority-fixture.sql

      - name: Verify concurrent Board journal commit order with restricted runtime role
        run: bash scripts/ci/test-organization-board-journal-order.sh

      - name: Verify lease-bound invitation mail capabilities
        run: scripts/ci/test-invitation-mail-scope.sh

      - name: Verify canonical Organization membership and routing integrity
        run: scripts/ci/test-organization-access-integrity.sh

      - name: Verify restricted routing discovery cannot widen across Organizations
        run: scripts/ci/test-routing-isolation.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Execute real C# upload persistence under the restricted API login
        env:
          STRATAAI_CONTRACT_ADMIN_CONNECTION: Host=127.0.0.1;Port=5432;Database=strataai_ci;Username=postgres;Password=postgres
          STRATAAI_CONTRACT_API_CONNECTION: Host=127.0.0.1;Port=5432;Database=strataai_ci;Username=strataai_api_runtime;Password=ci-api-runtime-password
          STRATAAI_CONTRACT_WORKER_CONNECTION: Host=127.0.0.1;Port=5432;Database=strataai_ci;Username=strataai_worker_runtime;Password=ci-worker-runtime-password
        run: |
          dotnet restore tests/StrataAI.Persistence.Contracts/StrataAI.Persistence.Contracts.csproj --locked-mode
          dotnet run --project tests/StrataAI.Persistence.Contracts/StrataAI.Persistence.Contracts.csproj --configuration Release --no-restore

      - name: Verify Board member event audit, journal, receipts and rollback under restricted API login
        env:
          STRATAAI_CONTRACT_ADMIN_CONNECTION: Host=127.0.0.1;Port=5432;Database=strataai_ci;Username=postgres;Password=postgres
          STRATAAI_CONTRACT_API_CONNECTION: Host=127.0.0.1;Port=5432;Database=strataai_ci;Username=strataai_api_runtime;Password=ci-api-runtime-password
          STRATAAI_CONTRACT_WORKER_CONNECTION: Host=127.0.0.1;Port=5432;Database=strataai_ci;Username=strataai_worker_runtime;Password=ci-worker-runtime-password
        run: dotnet run --project tests/StrataAI.Persistence.Contracts/StrataAI.Persistence.Contracts.csproj --configuration Release --no-build -- --board-member-events-only

  source-quality-gate:
    name: source-quality-gate
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - web-quality
      - dotnet-quality
      - postgres-integration
    steps:
      - name: Require all source quality jobs
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          WEB_RESULT: ${{ needs.web-quality.result }}
          DOTNET_RESULT: ${{ needs.dotnet-quality.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$METADATA_RESULT" "$WEB_RESULT" "$DOTNET_RESULT" "$POSTGRES_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Mandatory source quality job did not succeed: $result" >&2
              exit 1
            fi
          done

  build-images-once:
    name: build-images-once
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - source-quality-gate
    env:
      STRATAAI_BUILD_REVISION: ${{ needs.metadata.outputs.revision }}
      STRATAAI_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
      STRATAAI_BUILD_SOURCE: https://github.com/${{ needs.metadata.outputs.repository }}
      STRATAAI_BUILD_CREATED: ${{ needs.metadata.outputs.created_at }}
    steps:
      - uses: actions/checkout@v7

      - name: Download canonical build metadata
        uses: actions/download-artifact@v8
        with:
          name: strataai-build-metadata-${{ github.sha }}
          path: build-inputs

      - name: Verify canonical build identity before building
        run: |
          jq -e --arg revision "$STRATAAI_BUILD_REVISION" --arg version "$STRATAAI_BUILD_VERSION" --arg run "$GITHUB_RUN_ID" '.commitSha == $revision and .imageTag == $revision and .version == $version and .workflowRunId == $run' build-inputs/build-metadata.json >/dev/null

      - name: Build web image
        run: |
          docker build --file Dockerfile.web \
            --build-arg STRATAAI_BUILD_REVISION="$STRATAAI_BUILD_REVISION" \
            --build-arg STRATAAI_BUILD_VERSION="$STRATAAI_BUILD_VERSION" \
            --build-arg STRATAAI_BUILD_SOURCE="$STRATAAI_BUILD_SOURCE" \
            --build-arg STRATAAI_BUILD_CREATED="$STRATAAI_BUILD_CREATED" \
            --tag "strataai-web:${GITHUB_SHA}" .

      - name: Build API image
        run: |
          docker build --file Dockerfile.api \
            --build-arg STRATAAI_BUILD_REVISION="$STRATAAI_BUILD_REVISION" \
            --build-arg STRATAAI_BUILD_VERSION="$STRATAAI_BUILD_VERSION" \
            --build-arg STRATAAI_BUILD_SOURCE="$STRATAAI_BUILD_SOURCE" \
            --build-arg STRATAAI_BUILD_CREATED="$STRATAAI_BUILD_CREATED" \
            --tag "strataai-api:${GITHUB_SHA}" .

      - name: Build Worker image
        run: |
          docker build --file Dockerfile.worker \
            --build-arg STRATAAI_BUILD_REVISION="$STRATAAI_BUILD_REVISION" \
            --build-arg STRATAAI_BUILD_VERSION="$STRATAAI_BUILD_VERSION" \
            --build-arg STRATAAI_BUILD_SOURCE="$STRATAAI_BUILD_SOURCE" \
            --build-arg STRATAAI_BUILD_CREATED="$STRATAAI_BUILD_CREATED" \
            --tag "strataai-worker:${GITHUB_SHA}" .

      - name: Verify exact image provenance before export
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "strataai-web:${GITHUB_SHA}" "strataai-api:${GITHUB_SHA}" "strataai-worker:${GITHUB_SHA}" > build-inputs/image-inspection.json
          python3 scripts/ci/verify-image-labels.py --metadata build-inputs/build-metadata.json --images build-inputs/image-inspection.json --output build-inputs/image-provenance.json

      - name: Validate exact web image edge configuration
        run: docker run --rm --network none --entrypoint nginx "strataai-web:${GITHUB_SHA}" -t

      - name: Verify native preview codec in the exact Worker image
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 30s docker run --rm \
            --network none --read-only --user 1654:1654 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --memory-swap 512m --cpus 1 --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env DOTNET_EnableDiagnostics=0 \
            "strataai-worker:${GITHUB_SHA}" --verify-attachment-preview-runtime

      - name: Verify isolated preview child privilege drop from the normal root Worker
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 30s docker run --rm \
            --network none --read-only --user 0:0 \
            --cap-drop ALL --cap-add CHOWN --cap-add KILL --cap-add SETUID --cap-add SETGID --cap-add SETPCAP \
            --security-opt no-new-privileges \
            --memory 512m --memory-swap 512m --cpus 1 --pids-limit 96 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env DOTNET_EnableDiagnostics=0 \
            "strataai-worker:${GITHUB_SHA}" --verify-attachment-preview-runtime

      - name: Refuse root preview setup without scratch ownership capability
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          set +e
          timeout --signal=TERM --kill-after=5s 30s docker run --rm \
            --network none --read-only --user 0:0 \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add SETPCAP \
            --security-opt no-new-privileges \
            --memory 512m --memory-swap 512m --cpus 1 --pids-limit 96 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env DOTNET_EnableDiagnostics=0 \
            "strataai-worker:${GITHUB_SHA}" --verify-attachment-preview-runtime >"$report" 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -Fxq 'Worker preview runtime verification failed at fixed stage Scratch (preview_decoder_unavailable).' "$report"
          echo 'Root preview setup refuses missing scratch ownership capability.'

      - name: Verify real scanner transport in the exact Worker image
        timeout-minutes: 3
        env:
          STRATAAI_WORKER_IMAGE: strataai-worker:${{ github.sha }}
        run: bash scripts/ci/test-real-attachment-scanner.sh

      - name: Export exact built images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-artifacts
          cp build-inputs/build-metadata.json image-artifacts/build-metadata.json
          cp build-inputs/image-provenance.json image-artifacts/image-provenance.json
          docker save "strataai-web:${GITHUB_SHA}" | gzip -1 > image-artifacts/strataai-web.tar.gz
          docker save "strataai-api:${GITHUB_SHA}" | gzip -1 > image-artifacts/strataai-api.tar.gz
          docker save "strataai-worker:${GITHUB_SHA}" | gzip -1 > image-artifacts/strataai-worker.tar.gz
          (
            cd image-artifacts
            sha256sum strataai-web.tar.gz strataai-api.tar.gz strataai-worker.tar.gz build-metadata.json image-provenance.json > SHA256SUMS
          )

      - name: Upload immutable image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: strataai-images-${{ github.sha }}
          path: image-artifacts/
          retention-days: 14

  container-integration:
    name: container-integration (${{ matrix.suite }}, ${{ matrix.shard }}/${{ matrix.totalShards }})
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - build-images-once
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { suite: commands, shard: 1, totalShards: 1 }
          - { suite: browser-foundation, shard: 1, totalShards: 1 }
          - { suite: browser-notifications, shard: 1, totalShards: 1 }
          - { suite: browser-full, shard: 1, totalShards: 4 }
          - { suite: browser-full, shard: 2, totalShards: 4 }
          - { suite: browser-full, shard: 3, totalShards: 4 }
          - { suite: browser-full, shard: 4, totalShards: 4 }
    env:
      POSTGRES_DB: strataai
      POSTGRES_USER: strataai
      POSTGRES_PASSWORD: strataai-ci-password
      STRATAAI_API_DB_PASSWORD: ci-api-runtime-password
      STRATAAI_WORKER_DB_PASSWORD: ci-worker-runtime-password
      STRATAAI_BUILD_REVISION: ${{ needs.metadata.outputs.revision }}
      STRATAAI_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
      STRATAAI_WEB_IMAGE: strataai-web:${{ github.sha }}
      STRATAAI_API_IMAGE: strataai-api:${{ github.sha }}
      STRATAAI_WORKER_IMAGE: strataai-worker:${{ github.sha }}
      STRATAAI_METRICS_OTLP_ENDPOINT: http://metrics-collector:4318/v1/metrics
      # Transaction snapshots include complete job rows. Keep all discovery
      # loops quiescent until their explicit real-Worker delivery phases;
      # recipient authority delivery otherwise races removal receipt replay.
      STRATAAI_ORGANIZATION_DELETION_DISCOVERY_ENABLED: 'false'
      STRATAAI_ORGANIZATION_METADATA_DISCOVERY_ENABLED: 'false'
      STRATAAI_INVITATION_RECIPIENT_AUTHORITY_DISCOVERY_ENABLED: 'false'
      STRATAAI_INVITATION_ISSUER_AUTHORITY_DISCOVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Download exact built images
        uses: actions/download-artifact@v8
        with:
          name: strataai-images-${{ github.sha }}
          path: image-artifacts

      - name: Verify image archive checksums
        run: cd image-artifacts && sha256sum --check SHA256SUMS

      - name: Load exact built images
        shell: bash
        run: |
          set -euo pipefail
          gunzip -c image-artifacts/strataai-web.tar.gz | docker load
          gunzip -c image-artifacts/strataai-api.tar.gz | docker load
          gunzip -c image-artifacts/strataai-worker.tar.gz | docker load
          docker image inspect "strataai-web:${GITHUB_SHA}" "strataai-api:${GITHUB_SHA}" "strataai-worker:${GITHUB_SHA}" > image-artifacts/loaded-image-inspection.json
          python3 scripts/ci/verify-image-labels.py --metadata image-artifacts/build-metadata.json --images image-artifacts/loaded-image-inspection.json --expected image-artifacts/image-provenance.json

      - name: Start release topology
        shell: bash
        run: |
          set -euo pipefail
          auth_retry_key="$(openssl rand -base64 32)"
          echo "::add-mask::$auth_retry_key"
          echo 'STRATAAI_AUTH_RETRY_CURRENT_KEY=ci-auth-v1' >> "$GITHUB_ENV"
          echo "STRATAAI_AUTH_RETRY_KEYS=$(jq -nc --arg key "$auth_retry_key" '{"ci-auth-v1":$key}')" >> "$GITHUB_ENV"
          STRATAAI_AUTH_RETRY_CURRENT_KEY=ci-auth-v1 STRATAAI_AUTH_RETRY_KEYS="$(jq -nc --arg key "$auth_retry_key" '{"ci-auth-v1":$key}')" docker compose -f compose.release.yml -f compose.metrics.yml up -d --wait --wait-timeout 180

      - name: Apply release-database migrations
        run: scripts/apply-compose-migrations.sh

      - name: Provision least-privilege runtime database roles
        run: scripts/provision-compose-runtime-roles.sh

      - name: Reject unsafe runtime database roles in exact images
        run: scripts/ci/test-runtime-database-security.sh

      - name: Health, readiness and SPA deep-link smoke tests
        shell: bash
        run: |
          set -euo pipefail
          scripts/health-check.sh
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8081/readyz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/app/demo/boards/demo-board >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/app/demo/boards/demo-board/cards/demo-card >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/portal/demo >/dev/null

      - name: Verify embedded build identity and override resistance
        run: scripts/ci/test-build-identity.sh

      - name: Production does not expose demo reset
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}'             -H 'X-StrataAI-Request: 1' -X POST http://127.0.0.1:8080/api/demo/reset)"
          test "$status" = "404"

      - name: Verify production account defaults and prepare isolated auth fixture
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8080/api/auth/policy | jq -e '.allowSelfRegistration == false and .requireVerifiedEmail == true' >/dev/null
