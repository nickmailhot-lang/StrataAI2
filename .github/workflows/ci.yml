name: StrataAI2 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  # Keep every distinct main/tag commit: ref-wide groups retain only one pending
  # run by default, even when cancel-in-progress is false. Hosted CI topologies
  # and exact-SHA artifacts are isolated per run; this is not a deployment gate.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  STRATAAI_IMAGE_TAG: ${{ github.sha }}

jobs:
  web-quality:
    name: web-quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify browser readiness excludes previous-screen responses
        run: node --experimental-strip-types --test tests/browser/boardReadTracker.test.mjs

      - name: Verify security assertion failure paths
        run: scripts/ci/test-security-assertions.sh

      - name: Lint
        run: npm run lint

      - name: Verify feature HTTP requests retain the shared Problem boundary
        run: node --test tests/web-architecture.test.mjs

      - name: Verify retained performance evidence excludes private fields
        run: node --test tests/browser-performance.test.mjs

      - name: Unit and component tests
        run: npm test

      - name: Production web build
        env:
          VITE_STRATAAI_BUILD_REVISION: ${{ github.sha }}
          VITE_STRATAAI_BUILD_VERSION: 0.1.0-${{ github.run_number }}
        run: npm run build

      - name: Verify generated web build identity
        run: jq -e --arg revision "$GITHUB_SHA" --arg version "0.1.0-$GITHUB_RUN_NUMBER" '.revision == $revision and .version == $version' apps/web/dist/build-metadata.json

  dotnet-quality:
    name: dotnet-quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore StrataAI2.slnx --locked-mode

      - name: Validate release and event fixture configuration before image builds
        run: |
          docker compose --env-file .env.release.example -f compose.release.yml config --quiet
          STRATAAI_TEST_EVENT_ORGANIZATION_ID=11111111-1111-1111-1111-111111111111 docker compose --env-file .env.release.example -f compose.release.yml -f scripts/ci/compose.work-event-test.yml config --quiet
          docker compose --env-file .env.release.example -f compose.release.yml -f scripts/ci/compose.auth-test.yml -f scripts/ci/compose.atomic-test.yml -f scripts/ci/compose.owner-continuity-test.yml config --quiet
          STRATAAI_TEST_TOKEN_KEYS='{}' STRATAAI_TEST_INVITATION_ORGANIZATION_ID=11111111-1111-1111-1111-111111111111 docker compose --env-file .env.release.example -f compose.release.yml -f scripts/ci/compose.auth-test.yml -f scripts/ci/compose.identity-test.yml -f scripts/ci/compose.invitation-signup-test.yml -f scripts/ci/compose.invitation-mail-test.yml config --quiet

      - name: Reject dependency lock drift
        run: scripts/ci/test-dependency-locks.sh

      - name: Build with warnings as errors
        run: dotnet build StrataAI2.slnx --configuration Release --no-restore

      - name: Domain tests
        run: dotnet test tests/StrataAI.Domain.Tests/StrataAI.Domain.Tests.csproj --configuration Release --no-build

      - name: API host tests
        run: dotnet test tests/StrataAI.Api.Tests/StrataAI.Api.Tests.csproj --configuration Release --no-build


  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: strataai_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strataai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: strataai_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Apply ordered migrations
        run: scripts/ci/apply-migrations.sh

      - name: Verify every migrated tenant table retains its isolation boundary
        run: scripts/ci/test-tenant-schema.sh

      - name: Verify migration repeat, upgrade, failure rollback and serialization
        run: scripts/ci/test-migration-runner.sh

      - name: Verify pgvector and forced tenant RLS
        run: scripts/ci/test-rls.sh

      - name: Verify append-only audit storage
        run: scripts/ci/test-audit-append-only.sh

      - name: Verify tenant-scoped durable jobs and retry/crash behavior
        run: scripts/ci/test-background-jobs.sh

      - name: Verify global identity delivery capability and token integrity
        run: scripts/ci/test-identity-delivery-scope.sh

      - name: Verify real restricted runtime logins and elevation rejection
        run: scripts/ci/test-runtime-roles.sh

      - name: Verify lease-bound invitation mail capabilities
        run: scripts/ci/test-invitation-mail-scope.sh

      - name: Verify canonical Organization membership and routing integrity
        run: scripts/ci/test-organization-access-integrity.sh

      - name: Verify restricted routing discovery cannot widen across Organizations
        run: scripts/ci/test-routing-isolation.sh

  source-quality-gate:
    name: source-quality-gate
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - web-quality
      - dotnet-quality
      - postgres-integration
    steps:
      - name: Require all source quality jobs
        env:
          WEB_RESULT: ${{ needs.web-quality.result }}
          DOTNET_RESULT: ${{ needs.dotnet-quality.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$WEB_RESULT" "$DOTNET_RESULT" "$POSTGRES_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Mandatory source quality job did not succeed: $result" >&2
              exit 1
            fi
          done

  build-images-once:
    name: build-images-once
    runs-on: ubuntu-24.04
    needs:
      - source-quality-gate
    steps:
      - uses: actions/checkout@v7

      - name: Build web image
        run: |
          docker build             --file Dockerfile.web             --build-arg STRATAAI_BUILD_REVISION="${GITHUB_SHA}"             --build-arg STRATAAI_BUILD_VERSION="0.1.0-${GITHUB_RUN_NUMBER}"             --tag "strataai-web:${GITHUB_SHA}"             .

      - name: Build API image
        run: |
          docker build             --file Dockerfile.api             --build-arg STRATAAI_BUILD_REVISION="${GITHUB_SHA}"             --build-arg STRATAAI_BUILD_VERSION="0.1.0-${GITHUB_RUN_NUMBER}"             --tag "strataai-api:${GITHUB_SHA}"             .

      - name: Build Worker image
        run: |
          docker build             --file Dockerfile.worker             --build-arg STRATAAI_BUILD_REVISION="${GITHUB_SHA}"             --build-arg STRATAAI_BUILD_VERSION="0.1.0-${GITHUB_RUN_NUMBER}"             --tag "strataai-worker:${GITHUB_SHA}"             .

      - name: Export exact built images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-artifacts
          docker save "strataai-web:${GITHUB_SHA}" | gzip -1 > image-artifacts/strataai-web.tar.gz
          docker save "strataai-api:${GITHUB_SHA}" | gzip -1 > image-artifacts/strataai-api.tar.gz
          docker save "strataai-worker:${GITHUB_SHA}" | gzip -1 > image-artifacts/strataai-worker.tar.gz
          (
            cd image-artifacts
            sha256sum strataai-web.tar.gz strataai-api.tar.gz strataai-worker.tar.gz > SHA256SUMS
          )

      - name: Upload immutable image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: strataai-images-${{ github.sha }}
          path: image-artifacts/
          retention-days: 14

  container-integration:
    name: container-integration
    runs-on: ubuntu-24.04
    needs:
      - build-images-once
    env:
      POSTGRES_DB: strataai
      POSTGRES_USER: strataai
      POSTGRES_PASSWORD: strataai-ci-password
      STRATAAI_API_DB_PASSWORD: ci-api-runtime-password
      STRATAAI_WORKER_DB_PASSWORD: ci-worker-runtime-password
      STRATAAI_BUILD_REVISION: ${{ github.sha }}
      STRATAAI_BUILD_VERSION: 0.1.0-${{ github.run_number }}
      STRATAAI_WEB_IMAGE: strataai-web:${{ github.sha }}
      STRATAAI_API_IMAGE: strataai-api:${{ github.sha }}
      STRATAAI_WORKER_IMAGE: strataai-worker:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Download exact built images
        uses: actions/download-artifact@v8
        with:
          name: strataai-images-${{ github.sha }}
          path: image-artifacts

      - name: Verify image archive checksums
        run: cd image-artifacts && sha256sum --check SHA256SUMS

      - name: Load exact built images
        shell: bash
        run: |
          set -euo pipefail
          gunzip -c image-artifacts/strataai-web.tar.gz | docker load
          gunzip -c image-artifacts/strataai-api.tar.gz | docker load
          gunzip -c image-artifacts/strataai-worker.tar.gz | docker load

      - name: Start release topology
        shell: bash
        run: |
          set -euo pipefail
          auth_retry_key="$(openssl rand -base64 32)"
          echo "::add-mask::$auth_retry_key"
          echo 'STRATAAI_AUTH_RETRY_CURRENT_KEY=ci-auth-v1' >> "$GITHUB_ENV"
          echo "STRATAAI_AUTH_RETRY_KEYS=$(jq -nc --arg key "$auth_retry_key" '{"ci-auth-v1":$key}')" >> "$GITHUB_ENV"
          STRATAAI_AUTH_RETRY_CURRENT_KEY=ci-auth-v1 STRATAAI_AUTH_RETRY_KEYS="$(jq -nc --arg key "$auth_retry_key" '{"ci-auth-v1":$key}')" docker compose -f compose.release.yml up -d --wait --wait-timeout 180

      - name: Apply release-database migrations
        run: scripts/apply-compose-migrations.sh

      - name: Provision least-privilege runtime database roles
        run: scripts/provision-compose-runtime-roles.sh

      - name: Reject unsafe runtime database roles in exact images
        run: scripts/ci/test-runtime-database-security.sh

      - name: Health, readiness and SPA deep-link smoke tests
        shell: bash
        run: |
          set -euo pipefail
          scripts/health-check.sh
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8081/readyz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/app/demo/boards/demo-board >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/app/demo/boards/demo-board/cards/demo-card >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/portal/demo >/dev/null

      - name: Verify embedded build identity and override resistance
        run: scripts/ci/test-build-identity.sh

      - name: Production does not expose demo reset
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}'             -H 'X-StrataAI-Request: 1' -X POST http://127.0.0.1:8080/api/demo/reset)"
          test "$status" = "404"

      - name: Demo API runs without PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm             --name strataai-demo-api             -e STRATAAI_RUNTIME_MODE=demo             -p 18080:8080             "strataai-api:${GITHUB_SHA}"

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18080/api/demo/state >/dev/null
          curl --fail --silent -H 'X-StrataAI-Request: 1' -X POST http://127.0.0.1:18080/api/demo/reset >/dev/null
          scripts/ci/test-demo-auth.sh http://127.0.0.1:18080
          docker stop strataai-demo-api

      - name: Production fails closed without database configuration
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm             -e STRATAAI_RUNTIME_MODE=production             "strataai-api:${GITHUB_SHA}" >/tmp/production-missing-db.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Production API unexpectedly started without PostgreSQL configuration." >&2
            exit 1
          fi

      - name: Verify explicit Worker job scope and handler configuration
        run: scripts/ci/test-worker-job-configuration.sh "strataai-worker:${GITHUB_SHA}"

      - name: Verify production account defaults then test PostgreSQL profile concurrency
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8080/api/auth/policy | jq -e '.allowSelfRegistration == false and .requireVerifiedEmail == true' >/dev/null
          docker compose -f compose.release.yml -f scripts/ci/compose.auth-test.yml up -d --wait --wait-timeout 180 api
          scripts/ci/test-postgres-profile.sh http://localhost:8080

      - name: Identity audit rollback, logout waits and one-connection commands
        run: scripts/ci/test-identity-command-transactions.sh

      - name: Session-bound logout and deactivation receipts against exact release API
        run: bash scripts/ci/test-identity-revocation-retries.sh

      - name: Credential-checked sign-in retries against exact release API
        run: bash scripts/ci/test-identity-login-retries.sh

      - name: Atomic registration retries against exact release API
        run: bash scripts/ci/test-identity-registration-retries.sh

      - name: Invitation-backed closed registration and atomic expiry against exact release API
        run: bash scripts/ci/test-invitation-registration.sh

      - name: Verified-email invitation discovery and retry-safe acceptance
        run: bash scripts/ci/test-invitation-discovery.sh

      - name: Atomic invitation creation retries against exact release API
        run: bash scripts/ci/test-invitation-creation-retries.sh

      - name: Private board discovery and revoked membership against restricted PostgreSQL runtime
        run: scripts/ci/test-board-discovery.sh

      - name: Board administrator demotion continuity and atomic recovery
        run: scripts/ci/test-board-admin-continuity.sh

      - name: Work command and audit rollback against exact release API
        run: scripts/ci/test-work-command-transactions.sh

      - name: Organization audit rollback, revoked actor waits and concurrent owner departures
        run: scripts/ci/test-organization-commands.sh

      - name: Account deactivation and Organization active-owner continuity
        run: scripts/ci/test-account-owner-continuity.sh

      - name: Authorized bounded Organization member directory and post-wait revocation
        run: scripts/ci/test-organization-member-directory.sh

      - name: Durable work retry keys against exact release API
        run: scripts/ci/test-work-idempotency.sh

      - name: Atomic Work events and leased Worker readiness against exact release images
        run: scripts/ci/test-work-events.sh

      - name: Authorized contiguous event replay and mid-read revocation against exact release API
        run: scripts/ci/test-work-sync.sh
      - name: Check concurrent and large-board rank allocation
        run: scripts/ci/test-work-ranks.sh

      - name: Check write authorization and lifecycle during live database lock waits
        run: scripts/ci/test-work-command-scopes.sh

      - name: Prepare isolated identity mail transport and ephemeral signing keys
        run: |
          set -euo pipefail
          key1="$(openssl rand -base64 32)"
          key2="$(openssl rand -base64 32)"
          printf '::add-mask::%s\n' "$key1" "$key2"
          keys="$(jq -nc --arg k1 "$key1" --arg k2 "$key2" '{k1:$k1,k2:$k2}')"
          printf 'STRATAAI_TEST_TOKEN_KEYS=%s\n' "$keys" >> "$GITHUB_ENV"
          python3 scripts/ci/fake-identity-provider.py > /tmp/identity-provider.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:19090/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:19090/health >/dev/null

      - name: Identity mail against exact API/Worker images and restricted database role
        run: scripts/ci/test-identity-email.sh

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Mobile keyboard verification/recovery through Worker delivery
        env:
          STRATAAI_E2E_IDENTITY_MAIL: '1'
        run: npx playwright test tests/browser/identity-mail.spec.ts

      - name: Restore isolated unverified-email account fixture for profile browser tests
        # Earlier fixtures share the same socket peer and Nginx rate-limit zone.
        # Start fresh processes from the same loaded release images; keep all
        # production abuse limits enabled and preserve the PostgreSQL data.
        run: STRATAAI_TEST_REQUIRE_VERIFIED_EMAIL=false docker compose -f compose.release.yml -f scripts/ci/compose.auth-test.yml -f scripts/ci/compose.identity-test.yml up -d --no-deps --force-recreate --wait --wait-timeout 180 api web

      - name: Authenticated browser E2E against exact release images
        env:
          STRATAAI_E2E_RELEASE_HEADERS: '1'
          STRATAAI_E2E_RATE_PACING: '1'
        run: npx playwright test

      - name: Authentication and invitation abuse limits on API and edge
        run: |
          scripts/ci/test-rate-limits.sh http://localhost:8080
          scripts/ci/test-rate-limits.sh http://localhost:8088 security-headers

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain scoped browser performance measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-performance-${{ github.sha }}
          path: artifacts/browser-performance/kanban.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Capture container state and logs
        if: failure()
        shell: bash
        run: |
          docker compose -f compose.release.yml ps > compose-ps.txt || true
          docker compose -f compose.release.yml logs --no-color > compose.log || true

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-integration-diagnostics-${{ github.sha }}
          path: |
            compose-ps.txt
            compose.log
            ${{ runner.temp }}/identity-mail-failure.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop release topology
        if: always()
        run: docker compose -f compose.release.yml down -v --remove-orphans

  security:
    name: security
    runs-on: ubuntu-24.04
    needs:
      - build-images-once
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install locked web dependencies
        run: npm ci

      - name: Node dependency audit
        run: npm audit --audit-level=high

      - name: Restore .NET packages
        run: dotnet restore StrataAI2.slnx --locked-mode

      - name: .NET vulnerable dependency audit
        run: dotnet list StrataAI2.slnx package --vulnerable --include-transitive

      - name: Download exact built images
        uses: actions/download-artifact@v8
        with:
          name: strataai-images-${{ github.sha }}
          path: image-artifacts

      - name: Load exact built images
        shell: bash
        run: |
          set -euo pipefail
          gunzip -c image-artifacts/strataai-web.tar.gz | docker load
          gunzip -c image-artifacts/strataai-api.tar.gz | docker load
          gunzip -c image-artifacts/strataai-worker.tar.gz | docker load

      - name: Generate SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-artifacts
          for image in web api worker; do
            docker run --rm               -v /var/run/docker.sock:/var/run/docker.sock               -v "${PWD}/security-artifacts:/output"               aquasec/trivy:0.74.0               image --format cyclonedx               --output "/output/strataai-${image}.cdx.json"               "strataai-${image}:${GITHUB_SHA}"
          done

      - name: Secret scan
        run: |
          docker run --rm             -v "${PWD}:/workspace"             aquasec/trivy:0.74.0             fs --scanners secret --exit-code 1 /workspace

      - name: Block fixed Critical container vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          for image in web api worker; do
            docker run --rm               -v /var/run/docker.sock:/var/run/docker.sock               aquasec/trivy:0.74.0               image --exit-code 1 --ignore-unfixed --severity CRITICAL               "strataai-${image}:${GITHUB_SHA}"
          done

      - name: Upload SBOMs and security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-evidence-${{ github.sha }}
          path: security-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  required-ci:
    name: required-ci
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - source-quality-gate
      - build-images-once
      - container-integration
      - security
    steps:
      - name: Require every mandatory CI stage
        env:
          SOURCE_RESULT: ${{ needs.source-quality-gate.result }}
          BUILD_RESULT: ${{ needs.build-images-once.result }}
          CONTAINER_RESULT: ${{ needs.container-integration.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$SOURCE_RESULT" "$BUILD_RESULT" "$CONTAINER_RESULT" "$SECURITY_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Mandatory CI stage did not succeed: $result" >&2
              exit 1
            fi
          done

  release-bundle:
    name: release-bundle
    runs-on: ubuntu-24.04
    needs:
      - required-ci
    steps:
      - uses: actions/checkout@v7

      - name: Download exact tested images
        uses: actions/download-artifact@v8
        with:
          name: strataai-images-${{ github.sha }}
          path: image-artifacts

      - name: Assemble release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "bundle/images" "bundle/sbom"

          cp image-artifacts/strataai-web.tar.gz bundle/images/
          cp image-artifacts/strataai-api.tar.gz bundle/images/
          cp image-artifacts/strataai-worker.tar.gz bundle/images/
          cp compose.release.yml bundle/
          cp .env.release.example bundle/
          cp scripts/health-check.sh bundle/health-check.sh
          cp scripts/apply-compose-migrations.sh bundle/apply-migrations.sh
          cp scripts/migration-stream.sh bundle/migration-stream.sh
          cp scripts/provision-compose-runtime-roles.sh bundle/provision-runtime-roles.sh
          cp -R db bundle/db
          cp docs/release/README.md bundle/README.md

          cat > bundle/build-metadata.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "commitSha": "${GITHUB_SHA}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunNumber": "${GITHUB_RUN_NUMBER}",
            "version": "0.1.0-${GITHUB_RUN_NUMBER}",
            "images": {
              "web": "strataai-web:${GITHUB_SHA}",
              "api": "strataai-api:${GITHUB_SHA}",
              "worker": "strataai-worker:${GITHUB_SHA}"
            }
          }
          EOF

          (
            cd bundle
            find . -type f ! -name SHA256SUMS -print0               | sort -z               | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload runnable release bundle
        uses: actions/upload-artifact@v7
        with:
          name: strataai2-docker-bundle-${{ github.sha }}
          path: bundle/
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
