          STRATAAI_E2E_RATE_PACING: '1'
        run: |
          set -euo pipefail
          test "$(docker compose -f compose.release.yml exec -T api printenv STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL)" = true
          test "$(docker compose -f compose.release.yml exec -T worker printenv STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL)" = true
          npx playwright test tests/browser/organization-departure.spec.ts tests/browser/organization-departure-account.spec.ts

      - name: Strict verified-account Board management and personal preferences
        if: (matrix.suite == 'browser-notifications')
        env:
          STRATAAI_E2E_VERIFY_NOTIFICATION_ACCOUNTS: '1'
          STRATAAI_E2E_RATE_PACING: '1'
        run: |
          set -euo pipefail
          test "$(docker compose -f compose.release.yml exec -T api printenv STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL)" = true
          test "$(docker compose -f compose.release.yml exec -T worker printenv STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL)" = true
          npx playwright test tests/browser/board.spec.ts tests/browser/board-metadata.spec.ts tests/browser/board-copy.spec.ts tests/browser/board-lifecycle.spec.ts tests/browser/board-archive-account.spec.ts tests/browser/board-star.spec.ts tests/browser/activity-history.spec.ts tests/browser/board-background-client.spec.ts tests/browser/organization-board-live.spec.ts tests/browser/board-visibility.spec.ts tests/browser/board-members.spec.ts tests/browser/board-admin-live.spec.ts tests/browser/card-labels.spec.ts tests/browser/label-filter-live.spec.ts

      - name: Strict verified-account watch producers through native private inboxes
        if: (matrix.suite == 'browser-notifications')
        env:
          STRATAAI_E2E_VERIFY_WATCH_ACCOUNTS: '1'
          STRATAAI_E2E_VERIFY_NOTIFICATION_ACCOUNTS: '1'
          STRATAAI_E2E_RATE_PACING: '1'
        run: |
          set -euo pipefail
          test "$(docker compose -f compose.release.yml exec -T api printenv STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL)" = true
          test "$(docker compose -f compose.release.yml exec -T worker printenv STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL)" = true
          npx playwright test tests/browser/watch-cross-board-notifications.spec.ts tests/browser/watch-activity-matrix.spec.ts tests/browser/watch-subscriptions.spec.ts

      - name: Strict verified-account assignment mention and reminder native delivery
        if: (matrix.suite == 'browser-notifications')
        env:
          STRATAAI_E2E_VERIFY_NOTIFICATION_ACCOUNTS: '1'
          STRATAAI_E2E_RATE_PACING: '1'
        run: |
          set -euo pipefail
          test "$(docker compose -f compose.release.yml exec -T api printenv STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL)" = true
          test "$(docker compose -f compose.release.yml exec -T worker printenv STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL)" = true
          npx playwright test tests/browser/card-assignment-notifications.spec.ts tests/browser/comment-mentions.spec.ts tests/browser/comment-mass-mentions.spec.ts tests/browser/card-reminders.spec.ts tests/browser/notification-center.spec.ts --grep 'native assignment|native selected teammate|native confirmed groups|actual Worker due reminder|recipient inbox recovers'

      - name: Strict verified-account watch and permission ordering through observed database waits
        if: (matrix.suite == 'browser-notifications')
        env:
          STRATAAI_E2E_VERIFY_NOTIFICATION_ACCOUNTS: '1'
          STRATAAI_E2E_RATE_PACING: '1'
        run: |
          set -euo pipefail
          test "$(docker compose -f compose.release.yml exec -T api printenv STRATAAI_AUTH_REQUIRE_VERIFIED_EMAIL)" = true
          npx playwright test tests/browser/watch-trigger-order.spec.ts tests/browser/watch-permission-order.spec.ts

      - name: Restore isolated unverified-email account fixture for profile browser tests
        if: (matrix.suite == 'browser-full')
        # Earlier fixtures share the same socket peer and Nginx rate-limit zone.
        # Start fresh processes from the same loaded release images; keep all
        # production abuse limits enabled and preserve the PostgreSQL data.
        run: STRATAAI_TEST_REQUIRE_VERIFIED_EMAIL=false docker compose -f compose.release.yml -f scripts/ci/compose.auth-test.yml -f scripts/ci/compose.identity-test.yml up -d --no-deps --force-recreate --wait --wait-timeout 180 api web

      - name: Enable automatic Organization metadata and invitation authority routing for native browser acceptance
        if: (matrix.suite == 'browser-full')
        env:
          STRATAAI_ORGANIZATION_METADATA_DISCOVERY_ENABLED: 'true'
          STRATAAI_INVITATION_RECIPIENT_AUTHORITY_DISCOVERY_ENABLED: 'true'
          STRATAAI_INVITATION_ISSUER_AUTHORITY_DISCOVERY_ENABLED: 'true'
        run: |
          set -euo pipefail
          # Organization settings/membership and nonmember/Portal scenarios
          # require actual metadata and recipient/issuer loops. Persist this
          # phase's flags so scoped browser Workers restore the same routing
          # after each isolated scenario.
          printf '%s\n' 'STRATAAI_ORGANIZATION_METADATA_DISCOVERY_ENABLED=true' 'STRATAAI_INVITATION_RECIPIENT_AUTHORITY_DISCOVERY_ENABLED=true' 'STRATAAI_INVITATION_ISSUER_AUTHORITY_DISCOVERY_ENABLED=true' >> "$GITHUB_ENV"
          docker compose -f compose.release.yml -f scripts/ci/compose.identity-test.yml up -d --no-deps --force-recreate --wait --wait-timeout 180 worker
          test "$(docker compose -f compose.release.yml exec -T worker printenv STRATAAI_ORGANIZATION_METADATA_DISCOVERY_ENABLED)" = true
          test "$(docker compose -f compose.release.yml exec -T worker printenv STRATAAI_INVITATION_RECIPIENT_AUTHORITY_DISCOVERY_ENABLED)" = true
          test "$(docker compose -f compose.release.yml exec -T worker printenv STRATAAI_INVITATION_ISSUER_AUTHORITY_DISCOVERY_ENABLED)" = true

      - name: Authenticated browser E2E against exact release images
        if: (matrix.suite == 'browser-full')
        env:
          STRATAAI_E2E_RELEASE_HEADERS: '1'
          STRATAAI_E2E_RATE_PACING: '1'
        run: npx playwright test --shard=${{ matrix.shard }}/${{ matrix.totalShards }}

      - name: Authentication and invitation abuse limits on API and edge
        if: (matrix.suite == 'browser-full')
        run: |
          scripts/ci/test-rate-limits.sh http://localhost:8080
          scripts/ci/test-rate-limits.sh http://localhost:8088 security-headers

      - name: Prepare Retain browser failure evidence
        if: failure() && (matrix.suite == 'browser-foundation' || matrix.suite == 'browser-notifications' || matrix.suite == 'browser-full')
        run: python3 scripts/ci/prepare-evidence-artifact.py --metadata image-artifacts/build-metadata.json --output artifacts/retained/browser-diagnostics --entry "test-results/" "test-results" --entry "playwright-report/" "playwright-report"

      - name: Retain browser failure evidence
        if: failure() && (matrix.suite == 'browser-foundation' || matrix.suite == 'browser-notifications' || matrix.suite == 'browser-full')
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ github.sha }}-${{ matrix.suite }}-${{ matrix.shard }}
          path: artifacts/retained/browser-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare Retain scoped browser performance measurements
        if: always() && (matrix.suite == 'browser-full')
        run: python3 scripts/ci/prepare-evidence-artifact.py --metadata image-artifacts/build-metadata.json --output artifacts/retained/browser-performance --entry "artifacts/browser-performance/kanban.json" "kanban.json"

      - name: Retain scoped browser performance measurements
        if: always() && (matrix.suite == 'browser-full')
        uses: actions/upload-artifact@v7
        with:
          name: browser-performance-${{ github.sha }}-${{ matrix.shard }}
          path: artifacts/retained/browser-performance
          if-no-files-found: ignore
          retention-days: 90

      - name: Capture container state and logs
        if: failure()
        shell: bash
        run: |
          docker compose -f compose.release.yml ps > compose-ps.txt || true
          docker compose -f compose.release.yml logs --no-color > compose.log || true

      - name: Prepare Upload integration diagnostics
        if: failure()
        run: python3 scripts/ci/prepare-evidence-artifact.py --metadata image-artifacts/build-metadata.json --output artifacts/retained/container-integration-diagnostics --entry "compose-ps.txt" "compose-ps.txt" --entry "compose.log" "compose.log" --entry "demo-metadata-compose.log" "demo-metadata-compose.log" --entry "$RUNNER_TEMP/identity-mail-failure.json" "identity-mail-failure.json"

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-integration-diagnostics-${{ github.sha }}-${{ matrix.suite }}-${{ matrix.shard }}
          path: artifacts/retained/container-integration-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop release topology
        if: always()
        run: docker compose -f compose.release.yml down -v --remove-orphans

  security:
    name: security
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - build-images-once
    steps:
      - uses: actions/checkout@v7

      - name: Download exact built images
        uses: actions/download-artifact@v8
        with:
          name: strataai-images-${{ github.sha }}
          path: image-artifacts

      - name: Verify security input integrity and retain build identity
        env:
          STRATAAI_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd image-artifacts && sha256sum --check SHA256SUMS)
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg revision "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg version "$STRATAAI_BUILD_VERSION" '.repository == $repository and .commitSha == $revision and .imageTag == $revision and .workflowRunId == $run and .version == $version' image-artifacts/build-metadata.json >/dev/null
          mkdir -p security-artifacts
          cp image-artifacts/build-metadata.json security-artifacts/build-metadata.json
          cp image-artifacts/image-provenance.json security-artifacts/image-provenance.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install locked web dependencies
        run: npm ci

      - name: Node dependency audit
        run: npm audit --audit-level=high

      - name: Restore .NET packages
        run: dotnet restore StrataAI2.slnx --locked-mode

      - name: .NET vulnerable dependency audit
        run: dotnet list StrataAI2.slnx package --vulnerable --include-transitive

      - name: Load exact built images
        shell: bash
        run: |
          set -euo pipefail
          gunzip -c image-artifacts/strataai-web.tar.gz | docker load
          gunzip -c image-artifacts/strataai-api.tar.gz | docker load
          gunzip -c image-artifacts/strataai-worker.tar.gz | docker load
          docker image inspect "strataai-web:${GITHUB_SHA}" "strataai-api:${GITHUB_SHA}" "strataai-worker:${GITHUB_SHA}" > image-artifacts/loaded-image-inspection.json
          python3 scripts/ci/verify-image-labels.py --metadata image-artifacts/build-metadata.json --images image-artifacts/loaded-image-inspection.json --expected image-artifacts/image-provenance.json

      - name: Generate SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-artifacts
          for image in web api worker; do
            docker run --rm               -v /var/run/docker.sock:/var/run/docker.sock               -v "${PWD}/security-artifacts:/output"               aquasec/trivy:0.74.0               image --format cyclonedx               --output "/output/strataai-${image}.cdx.json"               "strataai-${image}:${GITHUB_SHA}"
          done

      - name: Secret scan
        run: |
          docker run --rm             -v "${PWD}:/workspace"             aquasec/trivy:0.74.0             fs --scanners secret --exit-code 1 /workspace

      - name: Block fixed Critical container vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          for image in web api worker; do
            docker run --rm               -v /var/run/docker.sock:/var/run/docker.sock               aquasec/trivy:0.74.0               image --exit-code 1 --ignore-unfixed --severity CRITICAL               "strataai-${image}:${GITHUB_SHA}"
          done

      - name: Scan and inventory pinned operator receiver
        run: |
          set -euo pipefail
          collector='otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1'
          docker run --rm -v "${PWD}/security-artifacts:/output" aquasec/trivy:0.74.0 image --format cyclonedx --output /output/metrics-collector.cdx.json "$collector"
          docker run --rm aquasec/trivy:0.74.0 image --exit-code 1 --ignore-unfixed --severity CRITICAL "$collector"

      - name: Bind retained security evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d security-artifacts ]; then
            (cd security-artifacts && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          fi

      - name: Upload SBOMs and security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-evidence-${{ github.sha }}
          path: security-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  required-ci:
    name: required-ci
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - source-quality-gate
      - build-images-once
      - container-integration
      - security
    steps:
      - name: Require every mandatory CI stage
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          SOURCE_RESULT: ${{ needs.source-quality-gate.result }}
          BUILD_RESULT: ${{ needs.build-images-once.result }}
          CONTAINER_RESULT: ${{ needs.container-integration.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$METADATA_RESULT" "$SOURCE_RESULT" "$BUILD_RESULT" "$CONTAINER_RESULT" "$SECURITY_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Mandatory CI stage did not succeed: $result" >&2
              exit 1
            fi
          done

  release-bundle:
    name: release-bundle
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - required-ci
    env:
      STRATAAI_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download exact tested images
        uses: actions/download-artifact@v8
        with:
          name: strataai-images-${{ github.sha }}
          path: image-artifacts

      - name: Download exact tested security evidence
        uses: actions/download-artifact@v8
        with:
          name: security-evidence-${{ github.sha }}
          path: security-artifacts

      - name: Verify tested release inputs
        run: python3 scripts/ci/verify-release-artifacts.py inputs --images image-artifacts --security security-artifacts

      - name: Assemble release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "bundle/images" "bundle/sbom"

          cp image-artifacts/strataai-web.tar.gz bundle/images/
          cp image-artifacts/strataai-api.tar.gz bundle/images/
          cp image-artifacts/strataai-worker.tar.gz bundle/images/
          cp image-artifacts/SHA256SUMS image-artifacts/build-metadata.json image-artifacts/image-provenance.json bundle/images/
          cp compose.release.yml compose.metrics.yml compose.attachments.yml bundle/
          mkdir -p bundle/deploy/metrics
          cp deploy/metrics/collector.yml bundle/deploy/metrics/
          cp .env.release.example bundle/
          cp scripts/health-check.sh bundle/health-check.sh
          cp scripts/apply-compose-migrations.sh bundle/apply-migrations.sh
          cp scripts/migration-stream.sh bundle/migration-stream.sh
          cp scripts/provision-compose-runtime-roles.sh bundle/provision-runtime-roles.sh
          cp -R db bundle/db
          cp docs/release/README.md bundle/README.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          build = json.loads(Path('image-artifacts/build-metadata.json').read_text())
          readme = Path('bundle/README.md')
          prefix = f"https://github.com/{build['repository']}/blob/{build['commitSha']}/docs/architecture/"
          readme.write_text(readme.read_text().replace('](../architecture/', '](' + prefix))
          PY

          cp image-artifacts/build-metadata.json bundle/build-metadata.json
          cp -R security-artifacts bundle/security
          for component in strataai-web strataai-api strataai-worker metrics-collector; do
            cp "security-artifacts/${component}.cdx.json" "bundle/sbom/${component}.cdx.json"
          done

          (
            cd bundle
            find . -type f ! -path ./SHA256SUMS -print0               | sort -z               | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Verify release bundle completeness and checksums
        run: python3 scripts/ci/verify-release-artifacts.py bundle --path bundle --images image-artifacts --security security-artifacts

      - name: Verify assembled bundle startup without source or SDKs
        timeout-minutes: 12
        run: bash scripts/ci/test-release-bundle-startup.sh bundle

      - name: Verify bundle unchanged after startup smoke
        run: python3 scripts/ci/verify-release-artifacts.py bundle --path bundle --images image-artifacts --security security-artifacts

      - name: Upload runnable release bundle
        uses: actions/upload-artifact@v7
        with:
          name: strataai2-docker-bundle-${{ github.sha }}
          path: bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
