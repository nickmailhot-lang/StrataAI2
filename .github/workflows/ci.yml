          key1="$(openssl rand -base64 32)"
          key2="$(openssl rand -base64 32)"
          printf '::add-mask::%s\n' "$key1" "$key2"
          keys="$(jq -nc --arg k1 "$key1" --arg k2 "$key2" '{k1:$k1,k2:$k2}')"
          printf 'STRATAAI_TEST_TOKEN_KEYS=%s\n' "$keys" >> "$GITHUB_ENV"
          python3 scripts/ci/fake-identity-provider.py > /tmp/identity-provider.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:19090/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:19090/health >/dev/null

