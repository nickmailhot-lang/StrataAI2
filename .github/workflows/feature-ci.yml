name: StrataAI2 feature CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      full:
        description: Run full qualification
        type: boolean
        default: false
      measure_backend:
        description: Add the reviewed backend lane for timing; retain all changed-source checks
        type: boolean
        default: false
      cold_cache:
        description: Measure fresh dependency caches without reducing selected checks
        type: boolean
        default: false
concurrency:
  group: feature-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
permissions:
  contents: read
  actions: read
env:
  FAST_CI_PLAN_DIR: artifacts/fast
  FAST_CI_COLD_CACHE: ${{ inputs.cold_cache || false }}
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      web: ${{ steps.plan.outputs.web }}
      runtime: ${{ steps.plan.outputs.runtime }}
      browser: ${{ steps.plan.outputs.browser }}
      dotnet: ${{ steps.plan.outputs.dotnet }}
      api: ${{ steps.plan.outputs.api }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - name: Start feature timing before setup and contracts
        id: clock
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: ${{ !inputs.cold_cache && 'npm' || '' }}
      - run: |
          if [ "$FAST_CI_COLD_CACHE" = true ]; then
            npm ci --ignore-scripts --cache "$RUNNER_TEMP/fast-cold-npm"
          else
            npm ci --ignore-scripts
          fi
      - name: Validate CI contracts and immutable full-suite coverage
        run: |
          node --test tests/automatic-qualification.test.mjs tests/local-workflow.test.mjs tests/feature-ci.test.mjs tests/integration-suites.test.mjs tests/build-metadata.test.mjs tests/delivery-progress.test.mjs tests/ticket-dependencies.test.mjs
          node scripts/ci/verify-integration-suites.mjs
          node scripts/ci/generate-feature-runtime.mjs --check
          python3 -m unittest discover -s tests -p 'release_artifacts_test.py'
          node scripts/delivery-progress.mjs validate
          node --test ci/fast/*.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s ci/fast -p '*_test.py'
      - name: Preserve delivery history
        if: github.event_name == 'pull_request'
        env:
          DELIVERY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/delivery-progress.mjs validate --base-ref "$DELIVERY_BASE_SHA"
      - name: Secret scan
        run: docker run --rm -v "${PWD}:/workspace" aquasec/trivy:0.74.0 fs --scanners secret --exit-code 1 /workspace
      - name: Select affected tests
        id: plan
        env:
          FORCE_FULL: ${{ inputs.full || false }}
          MEASURE_BACKEND: ${{ inputs.measure_backend || false }}
        run: node ci/fast/plan.mjs
      - name: Find equivalent completed qualification
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAST_CI_STARTED_AT: ${{ steps.clock.outputs.started }}
        run: node scripts/ci/automatic-qualification.mjs lookup
      - name: Retain selection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feature-selection-${{ github.sha }}
          path: |
            artifacts/fast/feature-plan.json
            artifacts/fast/ci-request.json
          if-no-files-found: error
          retention-days: 14
  web:
    needs: select
    if: needs.select.outputs.reused == 'false' && needs.select.outputs.web == 'true' && needs.select.outputs.full != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    env:
      FAST_CI_WEB_PARTITION: ${{ matrix.partition }}
      STRATAAI_POST_MVP_LOAD_TESTS: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: ${{ !inputs.cold_cache && 'npm' || '' }}
      - run: |
          if [ "$FAST_CI_COLD_CACHE" = true ]; then
            npm ci --ignore-scripts --cache "$RUNNER_TEMP/fast-cold-npm"
          else
            npm ci --ignore-scripts
          fi
      - uses: actions/download-artifact@v8
        with:
          name: feature-selection-${{ github.sha }}
          path: artifacts/fast
      - if: matrix.partition == 1
        run: npx playwright install --with-deps chromium
      - name: Selected web types, lint, complete unit files, build and compiled UI smoke
        run: node ci/fast/run.mjs web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fast-web-${{ github.sha }}-${{ matrix.partition }}
          path: artifacts/fast/web
          if-no-files-found: error
  backend:
    needs: select
    if: needs.select.outputs.reused == 'false' && needs.select.outputs.dotnet == 'true' && needs.select.outputs.full != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: ${{ !inputs.cold_cache }}
          cache-dependency-path: '**/packages.lock.json'
      - run: |
          if [ "$FAST_CI_COLD_CACHE" = true ]; then
            npm ci --ignore-scripts --cache "$RUNNER_TEMP/fast-cold-npm"
          else
            npm ci --ignore-scripts
          fi
      - uses: actions/download-artifact@v8
        with:
          name: feature-selection-${{ github.sha }}
          path: artifacts/fast
      - name: Compile, complete Domain tests and reviewed feature HTTP methods
        run: node ci/fast/run.mjs backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fast-backend-${{ github.sha }}
          path: artifacts/fast/backend
          if-no-files-found: error
  full:
    needs: select
    if: needs.select.outputs.reused == 'false' && needs.select.outputs.full == 'true'
    uses: ./.github/workflows/full-sanity.yml
  required-ci:
    name: required-ci
    if: always()
    needs: [select, web, backend, full]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: feature-selection-${{ github.sha }}
          path: artifacts/fast
      - uses: actions/download-artifact@v8
        if: needs.select.outputs.reused == 'false' && needs.select.outputs.web == 'true' && needs.select.outputs.full != 'true'
        with:
          pattern: fast-web-${{ github.sha }}-*
          path: artifacts/fast/web-partitions
          merge-multiple: false
      - name: Verify every complete web partition and original case inventory
        if: needs.select.outputs.reused == 'false' && needs.select.outputs.web == 'true' && needs.select.outputs.full != 'true'
        run: node ci/fast/web-partitions.mjs verify
      - name: Require exactly the selected checks
        id: qualified
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
          WEB_SELECTED: ${{ needs.select.outputs.web }}
          RUNTIME_SELECTED: ${{ needs.select.outputs.runtime }}
          FULL_SELECTED: ${{ needs.select.outputs.full }}
          WEB_RESULT: ${{ needs.web.result }}
          RUNTIME_RESULT: skipped
          BACKEND_SELECTED: ${{ needs.select.outputs.dotnet }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FULL_RESULT: ${{ needs.full.result }}
          REUSED: ${{ needs.select.outputs.reused }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/automatic-qualification.mjs complete
      - name: Retain successful qualification identity
        if: needs.select.outputs.reused == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ci-qualification-${{ steps.qualified.outputs.key }}
          path: artifacts/fast/ci-qualification.json
          if-no-files-found: error
          retention-days: 14
