# Generated by node scripts/ci/generate-feature-runtime.mjs; edit full-sanity.yml, then regenerate.
name: StrataAI2 feature runtime
on:
  workflow_call:
    inputs:
      browser:
        required: true
        type: string
permissions:
  contents: read
env:
  STRATAAI_POST_MVP_LOAD_TESTS: ${{ vars.STRATAAI_POST_MVP_LOAD_TESTS || '0' }}
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  STRATAAI_IMAGE_TAG: ${{ github.sha }}
  STRATAAI_TEST_IDENTITY_PROVIDER_INSTANCE: ${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      short_sha: ${{ steps.identity.outputs.short_sha }}
      version: ${{ steps.identity.outputs.version }}
      image_tag: ${{ steps.identity.outputs.image_tag }}
      workflow_run_id: ${{ steps.identity.outputs.workflow_run_id }}
      repository: ${{ steps.identity.outputs.repository }}
      created_at: ${{ steps.identity.outputs.created_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify metadata refusal and version contracts
        run: node --test tests/build-metadata.test.mjs
      - name: Verify complete PRD and architecture dependency analysis
        run: node --test tests/ticket-dependencies.test.mjs
      - name: Verify delivery ledger and completion refusal contracts
        run: |
          node scripts/delivery-progress.mjs validate
          node --test tests/delivery-progress.test.mjs
          node --test tests/local-workflow.test.mjs
      - name: Preserve delivery history against the target branch
        if: github.event_name == 'pull_request'
        env:
          DELIVERY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$DELIVERY_BASE_SHA"
          node scripts/delivery-progress.mjs validate --base-ref "$DELIVERY_BASE_SHA"
      - name: Calculate verified exact-commit metadata
        id: identity
        run: node scripts/ci/build-metadata.mjs
      - name: Retain canonical build metadata
        uses: actions/upload-artifact@v7
        with:
          name: strataai-build-metadata-${{ github.sha }}
          path: build-metadata.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
  build-images-once:
    name: build-images-once
    runs-on: ubuntu-24.04
    needs:
      - metadata
    env:
      STRATAAI_BUILD_REVISION: ${{ needs.metadata.outputs.revision }}
      STRATAAI_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
      STRATAAI_BUILD_SOURCE: https://github.com/${{ needs.metadata.outputs.repository }}
      STRATAAI_BUILD_CREATED: ${{ needs.metadata.outputs.created_at }}
    steps:
      - uses: actions/checkout@v7
      - name: Download canonical build metadata
        uses: actions/download-artifact@v8
        with:
          name: strataai-build-metadata-${{ github.sha }}
          path: build-inputs
      - name: Verify canonical build identity before building
        run: |
          jq -e --arg revision "$STRATAAI_BUILD_REVISION" --arg version "$STRATAAI_BUILD_VERSION" --arg run "$GITHUB_RUN_ID" '.commitSha == $revision and .imageTag == $revision and .version == $version and .workflowRunId == $run' build-inputs/build-metadata.json >/dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/strataai-buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile.*', '**/packages.lock.json', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile.*', '**/packages.lock.json', 'package-lock.json') }}-
            ${{ runner.os }}-buildx-
      - name: Build web image
        run: |
          docker buildx build --load --file Dockerfile.web \
            --cache-from type=local,src=/tmp/strataai-buildx-cache/web \
            --cache-to type=local,dest=/tmp/strataai-buildx-new/web,mode=max \
            --build-arg STRATAAI_BUILD_REVISION="$STRATAAI_BUILD_REVISION" \
            --build-arg STRATAAI_BUILD_VERSION="$STRATAAI_BUILD_VERSION" \
            --build-arg STRATAAI_BUILD_SOURCE="$STRATAAI_BUILD_SOURCE" \
            --build-arg STRATAAI_BUILD_CREATED="$STRATAAI_BUILD_CREATED" \
            --tag "strataai-web:${GITHUB_SHA}" .
      - name: Build API image
        run: |
          docker buildx build --load --file Dockerfile.api \
            --cache-from type=local,src=/tmp/strataai-buildx-cache/api \
            --cache-to type=local,dest=/tmp/strataai-buildx-new/api,mode=max \
            --build-arg STRATAAI_BUILD_REVISION="$STRATAAI_BUILD_REVISION" \
            --build-arg STRATAAI_BUILD_VERSION="$STRATAAI_BUILD_VERSION" \
            --build-arg STRATAAI_BUILD_SOURCE="$STRATAAI_BUILD_SOURCE" \
            --build-arg STRATAAI_BUILD_CREATED="$STRATAAI_BUILD_CREATED" \
            --tag "strataai-api:${GITHUB_SHA}" .
      - name: Build Worker image
        run: |
          docker buildx build --load --file Dockerfile.worker \
            --cache-from type=local,src=/tmp/strataai-buildx-cache/worker \
            --cache-to type=local,dest=/tmp/strataai-buildx-new/worker,mode=max \
            --build-arg STRATAAI_BUILD_REVISION="$STRATAAI_BUILD_REVISION" \
            --build-arg STRATAAI_BUILD_VERSION="$STRATAAI_BUILD_VERSION" \
            --build-arg STRATAAI_BUILD_SOURCE="$STRATAAI_BUILD_SOURCE" \
            --build-arg STRATAAI_BUILD_CREATED="$STRATAAI_BUILD_CREATED" \
            --tag "strataai-worker:${GITHUB_SHA}" .
      - name: Rotate Docker layer cache
        run: |
          rm -rf /tmp/strataai-buildx-cache
          mv /tmp/strataai-buildx-new /tmp/strataai-buildx-cache
      - name: Verify exact image provenance before export
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "strataai-web:${GITHUB_SHA}" "strataai-api:${GITHUB_SHA}" "strataai-worker:${GITHUB_SHA}" > build-inputs/image-inspection.json
          python3 scripts/ci/verify-image-labels.py --metadata build-inputs/build-metadata.json --images build-inputs/image-inspection.json --output build-inputs/image-provenance.json
      - name: Validate exact web image edge configuration
        run: docker run --rm --network none --entrypoint nginx "strataai-web:${GITHUB_SHA}" -t
      - name: Verify native preview codec in the exact Worker image
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 30s docker run --rm \
            --network none --read-only --user 1654:1654 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --memory-swap 512m --cpus 1 --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env DOTNET_EnableDiagnostics=0 \
            "strataai-worker:${GITHUB_SHA}" --verify-attachment-preview-runtime
      - name: Verify isolated preview child privilege drop from the normal root Worker
        timeout-minutes: 2
        run: |
          timeout --signal=TERM --kill-after=5s 30s docker run --rm \
            --network none --read-only --user 0:0 \
            --cap-drop ALL --cap-add CHOWN --cap-add KILL --cap-add SETUID --cap-add SETGID --cap-add SETPCAP \
            --security-opt no-new-privileges \
            --memory 512m --memory-swap 512m --cpus 1 --pids-limit 96 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env DOTNET_EnableDiagnostics=0 \
            "strataai-worker:${GITHUB_SHA}" --verify-attachment-preview-runtime
      - name: Refuse root preview setup without scratch ownership capability
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          set +e
          timeout --signal=TERM --kill-after=5s 30s docker run --rm \
            --network none --read-only --user 0:0 \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add SETPCAP \
            --security-opt no-new-privileges \
            --memory 512m --memory-swap 512m --cpus 1 --pids-limit 96 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env DOTNET_EnableDiagnostics=0 \
            "strataai-worker:${GITHUB_SHA}" --verify-attachment-preview-runtime >"$report" 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -Fxq 'Worker preview runtime verification failed at fixed stage Scratch (preview_decoder_unavailable).' "$report"
          echo 'Root preview setup refuses missing scratch ownership capability.'
      - name: Verify real scanner transport in the exact Worker image
        timeout-minutes: 3
        env:
          STRATAAI_WORKER_IMAGE: strataai-worker:${{ github.sha }}
        run: bash scripts/ci/test-real-attachment-scanner.sh
      - name: Export exact built images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-artifacts
          cp build-inputs/build-metadata.json image-artifacts/build-metadata.json
          cp build-inputs/image-provenance.json image-artifacts/image-provenance.json
          docker save "strataai-web:${GITHUB_SHA}" | gzip -1 > image-artifacts/strataai-web.tar.gz
          docker save "strataai-api:${GITHUB_SHA}" | gzip -1 > image-artifacts/strataai-api.tar.gz
          docker save "strataai-worker:${GITHUB_SHA}" | gzip -1 > image-artifacts/strataai-worker.tar.gz
          (
            cd image-artifacts
            sha256sum strataai-web.tar.gz strataai-api.tar.gz strataai-worker.tar.gz build-metadata.json image-provenance.json > SHA256SUMS
          )
      - name: Upload immutable image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: strataai-images-${{ github.sha }}
          path: image-artifacts/
          retention-days: 14
          compression-level: 0
  runtime:
    name: feature-runtime
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - build-images-once
    env:
      POSTGRES_DB: strataai
      POSTGRES_USER: strataai
      POSTGRES_PASSWORD: strataai-ci-password
      STRATAAI_API_DB_PASSWORD: ci-api-runtime-password
      STRATAAI_WORKER_DB_PASSWORD: ci-worker-runtime-password
      STRATAAI_BUILD_REVISION: ${{ needs.metadata.outputs.revision }}
      STRATAAI_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
      STRATAAI_WEB_IMAGE: strataai-web:${{ github.sha }}
      STRATAAI_API_IMAGE: strataai-api:${{ github.sha }}
      STRATAAI_WORKER_IMAGE: strataai-worker:${{ github.sha }}
      STRATAAI_METRICS_OTLP_ENDPOINT: http://metrics-collector:4318/v1/metrics
      STRATAAI_ORGANIZATION_DELETION_DISCOVERY_ENABLED: "false"
      STRATAAI_ORGANIZATION_METADATA_DISCOVERY_ENABLED: "false"
      STRATAAI_INVITATION_RECIPIENT_AUTHORITY_DISCOVERY_ENABLED: "false"
      STRATAAI_INVITATION_ISSUER_AUTHORITY_DISCOVERY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Download exact built images
        uses: actions/download-artifact@v8
        with:
          name: strataai-images-${{ github.sha }}
          path: image-artifacts
      - name: Verify image archive checksums
        run: cd image-artifacts && sha256sum --check SHA256SUMS
      - name: Load exact built images
        shell: bash
        run: |
          set -euo pipefail
          gunzip -c image-artifacts/strataai-web.tar.gz | docker load
          gunzip -c image-artifacts/strataai-api.tar.gz | docker load
          gunzip -c image-artifacts/strataai-worker.tar.gz | docker load
          docker image inspect "strataai-web:${GITHUB_SHA}" "strataai-api:${GITHUB_SHA}" "strataai-worker:${GITHUB_SHA}" > image-artifacts/loaded-image-inspection.json
          python3 scripts/ci/verify-image-labels.py --metadata image-artifacts/build-metadata.json --images image-artifacts/loaded-image-inspection.json --expected image-artifacts/image-provenance.json --archives image-artifacts
          rm -- image-artifacts/loaded-image-inspection.json
      - name: Start release topology
        shell: bash
        run: |
          set -euo pipefail
          auth_retry_key="$(openssl rand -base64 32)"
          echo "::add-mask::$auth_retry_key"
          echo 'STRATAAI_AUTH_RETRY_CURRENT_KEY=ci-auth-v1' >> "$GITHUB_ENV"
          echo "STRATAAI_AUTH_RETRY_KEYS=$(jq -nc --arg key "$auth_retry_key" '{"ci-auth-v1":$key}')" >> "$GITHUB_ENV"
          STRATAAI_AUTH_RETRY_CURRENT_KEY=ci-auth-v1 STRATAAI_AUTH_RETRY_KEYS="$(jq -nc --arg key "$auth_retry_key" '{"ci-auth-v1":$key}')" docker compose -f compose.release.yml -f compose.metrics.yml up -d --wait --wait-timeout 180
      - name: Apply release-database migrations
        run: scripts/apply-compose-migrations.sh
      - name: Provision least-privilege runtime database roles
        run: scripts/provision-compose-runtime-roles.sh
      - name: Reject unsafe runtime database roles in exact images
        run: scripts/ci/test-runtime-database-security.sh
      - name: Verify installed configuration identities, relationships and restricted capabilities
        run: bash scripts/ci/test-organization-configuration-schema.sh
      - name: Retention policy schema and restricted capabilities
        run: bash scripts/ci/test-record-retention-policy-schema.sh
      - name: Health, readiness and SPA deep-link smoke tests
        shell: bash
        run: |
          set -euo pipefail
          scripts/health-check.sh
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8081/readyz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/app/demo/boards/demo-board >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/app/demo/boards/demo-board/cards/demo-card >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/portal/demo >/dev/null
      - name: Verify embedded build identity and override resistance
        run: scripts/ci/test-build-identity.sh
      - name: Production does not expose demo reset
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}'             -H 'X-StrataAI-Request: 1' -X POST http://127.0.0.1:8080/api/demo/reset)"
          test "$status" = "404"
      - name: Verify production account defaults and prepare isolated auth fixture
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8080/api/auth/policy | jq -e '.allowSelfRegistration == false and .requireVerifiedEmail == true' >/dev/null
          docker compose -f compose.release.yml -f scripts/ci/compose.auth-test.yml up -d --wait --wait-timeout 180 api
      - name: Invitation-backed closed registration and atomic expiry against exact release API
        run: bash scripts/ci/test-invitation-registration.sh
      - name: Verified-email invitation discovery and retry-safe acceptance
        run: bash scripts/ci/test-invitation-discovery.sh
      - name: Private board discovery and revoked membership against restricted PostgreSQL runtime
        run: scripts/ci/test-board-discovery.sh
      - name: Board visibility and role HTTP permission matrix against exact API and restricted PostgreSQL
        run: bash scripts/ci/test-board-permission-matrix.sh
      - name: Board administrator demotion continuity and atomic recovery
        run: scripts/ci/test-board-admin-continuity.sh
      - name: Organization configuration tenant-scoped usage
        run: bash scripts/ci/test-organization-configuration-usage.sh
      - name: Retention policy authorized commands and private history against exact release API
        run: bash scripts/ci/test-retention-policy-http.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Prepare isolated identity mail transport and ephemeral signing keys
        run: |
          set -euo pipefail
          key1="$(openssl rand -base64 32)"
          key2="$(openssl rand -base64 32)"
          printf '::add-mask::%s\n' "$key1" "$key2"
          keys="$(jq -nc --arg k1 "$key1" --arg k2 "$key2" '{k1:$k1,k2:$k2}')"
          printf 'STRATAAI_TEST_TOKEN_KEYS=%s\n' "$keys" >> "$GITHUB_ENV"
          python3 scripts/ci/fake-identity-provider.py > /tmp/identity-provider.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:19090/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:19090/health >/dev/null
      - name: Restore isolated unverified-email account fixture for profile browser tests
        run: STRATAAI_TEST_REQUIRE_VERIFIED_EMAIL=false docker compose -f compose.release.yml -f scripts/ci/compose.auth-test.yml -f scripts/ci/compose.identity-test.yml up -d --no-deps --force-recreate --wait --wait-timeout 180 api web
      - name: Enable automatic Organization metadata and invitation authority routing for native browser acceptance
        env:
          STRATAAI_ORGANIZATION_METADATA_DISCOVERY_ENABLED: "true"
          STRATAAI_INVITATION_RECIPIENT_AUTHORITY_DISCOVERY_ENABLED: "true"
          STRATAAI_INVITATION_ISSUER_AUTHORITY_DISCOVERY_ENABLED: "true"
        run: |
          set -euo pipefail
          # Organization settings/membership and nonmember/Portal scenarios
          # require actual metadata and recipient/issuer loops. Persist this
          # phase's flags so scoped browser Workers restore the same routing
          # after each isolated scenario.
          printf '%s\n' 'STRATAAI_ORGANIZATION_METADATA_DISCOVERY_ENABLED=true' 'STRATAAI_INVITATION_RECIPIENT_AUTHORITY_DISCOVERY_ENABLED=true' 'STRATAAI_INVITATION_ISSUER_AUTHORITY_DISCOVERY_ENABLED=true' >> "$GITHUB_ENV"
          docker compose -f compose.release.yml -f scripts/ci/compose.identity-test.yml up -d --no-deps --force-recreate --wait --wait-timeout 180 worker
          test "$(docker compose -f compose.release.yml exec -T worker printenv STRATAAI_ORGANIZATION_METADATA_DISCOVERY_ENABLED)" = true
          test "$(docker compose -f compose.release.yml exec -T worker printenv STRATAAI_INVITATION_RECIPIENT_AUTHORITY_DISCOVERY_ENABLED)" = true
          test "$(docker compose -f compose.release.yml exec -T worker printenv STRATAAI_INVITATION_ISSUER_AUTHORITY_DISCOVERY_ENABLED)" = true
      - name: Selected feature browser acceptance against exact images
        env:
          STRATAAI_E2E_RELEASE_HEADERS: "1"
          STRATAAI_E2E_RATE_PACING: "1"
          STRATAAI_SELECTED_BROWSER: ${{ inputs.browser }}
        run: node scripts/ci/run-feature-browser.mjs
      - name: Authentication and invitation abuse limits on API and edge
        run: |
          scripts/ci/test-rate-limits.sh http://localhost:8080
          scripts/ci/test-rate-limits.sh http://localhost:8088 security-headers
      - name: Prepare Retain browser failure evidence
        if: failure()
        run: python3 scripts/ci/prepare-evidence-artifact.py --metadata image-artifacts/build-metadata.json --output artifacts/retained/browser-diagnostics --entry "test-results/" "test-results" --entry "playwright-report/" "playwright-report"
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ github.sha }}-feature-1
          path: artifacts/retained/browser-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare Retain scoped browser performance measurements
        if: always()
        run: python3 scripts/ci/prepare-evidence-artifact.py --metadata image-artifacts/build-metadata.json --output artifacts/retained/browser-performance --entry "artifacts/browser-performance/kanban.json" "kanban.json"
      - name: Retain scoped browser performance measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-performance-${{ github.sha }}-1
          path: artifacts/retained/browser-performance
          if-no-files-found: ignore
          retention-days: 90
      - name: Capture container state and logs
        if: failure()
        shell: bash
        run: |
          docker compose -f compose.release.yml ps > compose-ps.txt || true
          docker compose -f compose.release.yml logs --no-color > compose.log || true
      - name: Prepare Upload integration diagnostics
        if: failure()
        run: python3 scripts/ci/prepare-evidence-artifact.py --metadata image-artifacts/build-metadata.json --output artifacts/retained/container-integration-diagnostics --entry "compose-ps.txt" "compose-ps.txt" --entry "compose.log" "compose.log" --entry "watch-order-worker.log" "watch-order-worker.log" --entry "demo-metadata-compose.log" "demo-metadata-compose.log" --entry "$RUNNER_TEMP/identity-mail-failure.json" "identity-mail-failure.json"
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-integration-diagnostics-${{ github.sha }}-feature-1
          path: artifacts/retained/container-integration-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop release topology
        if: always()
        run: docker compose -f compose.release.yml down -v --remove-orphans
    timeout-minutes: 30
